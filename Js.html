<script>
'use strict';
/*
 * Js.html — frontend POS. ATURAN: data dinamis selalu lewat textContent / h(), tidak pernah innerHTML.
 * Satu pintu ke server: api() (menyisipkan token, menangani sesi habis & wajib ganti PIN).
 */
(function () {
  // ======================================================================
  // Utilitas
  // ======================================================================
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  const fmtRp = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 });
  const fmtAngka = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 3 });
  const rupiah = (n) => fmtRp.format(Number(n) || 0);
  const angka = (n) => fmtAngka.format(Number(n) || 0);
  const bulatQty = (n) => Math.round((Number(n) || 0) * 1000) / 1000;
  const bulatUang = (n) => Math.round(Number(n) || 0);
  /** "50.000" / "Rp 50000" -> 50000 */
  const parseUang = (v) => Number(String(v || '').replace(/[^\d]/g, '')) || 0;
  /**
   * Qty format Indonesia: "1,5" -> 1.5, "1.000" -> 1000, "1.000,25" -> 1000.25.
   * Titik tanpa koma dianggap desimal kecuali tepat 3 digit di belakangnya ("2.5" -> 2.5).
   */
  const parseQty = (v) => {
    let s = String(v === undefined || v === null ? '' : v).trim().replace(/\s/g, '');
    if (s.indexOf(',') !== -1) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    const n = s === '' ? NaN : Number(s);
    return Number.isFinite(n) ? n : NaN;
  };

  /** Buat elemen. Anak berupa string selalu menjadi text node (aman dari XSS). */
  function h(tag, props, ...anak) {
    const el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach((k) => {
        const v = props[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k === 'value') el.value = v;
        else if (typeof v === 'boolean') el[k] = v;
        else el.setAttribute(k, v);
      });
    }
    anak.flat().forEach((a) => {
      if (a === null || a === undefined || a === false) return;
      el.append(a instanceof Node ? a : document.createTextNode(String(a)));
    });
    return el;
  }

  const penyimpan = {
    ambil(k, bawaan) {
      try {
        const v = sessionStorage.getItem(k);
        return v === null ? bawaan : JSON.parse(v);
      } catch (e) { return bawaan; }
    },
    taruh(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* abaikan */ } },
    hapus(k) { try { sessionStorage.removeItem(k); } catch (e) { /* abaikan */ } },
  };

  let timerToast = null;
  /** aksi opsional: {label, fn} — tombol di dalam toast (mis. "Urungkan"). */
  function toast(pesan, jenis, aksi) {
    const el = $('#toast');
    el.replaceChildren(h('span', { text: pesan }));
    if (aksi) {
      el.append(h('button', {
        type: 'button', class: 'toast-aksi', text: aksi.label,
        onclick: () => { el.hidden = true; aksi.fn(); },
      }));
    }
    el.className = 'toast' + (jenis ? ' ' + jenis : '');
    el.hidden = false;
    clearTimeout(timerToast);
    timerToast = setTimeout(() => { el.hidden = true; }, aksi ? 6000 : jenis === 'galat' ? 5000 : 3000);
  }

  function memuat(ya) { $('#memuat').hidden = !ya; }

  /** Nonaktifkan tombol selama aksi berjalan (cegah tap ganda = transaksi ganda). */
  async function denganTombol(tombol, teksSibuk, fn) {
    if (tombol.disabled) return;
    const teksAsli = tombol.textContent;
    tombol.disabled = true;
    tombol.textContent = teksSibuk;
    try { return await fn(); } finally {
      tombol.disabled = false;
      tombol.textContent = teksAsli;
    }
  }

  function hueDariTeks(s) {
    let x = 0;
    for (let i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) % 360;
    return x;
  }

  function inisial(nama) {
    const kata = String(nama || '?').trim().split(/\s+/);
    return ((kata[0] || '?')[0] + (kata[1] ? kata[1][0] : '')).toUpperCase();
  }

  function gambarItem(item) {
    const cadangan = h('div', { class: 'inisial', text: inisial(item.nama) });
    cadangan.style.setProperty('--h', hueDariTeks(item.nama));
    if (!/^https:\/\//.test(item.foto || '')) return cadangan;
    const img = h('img', { class: 'gambar-produk', alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' });
    img.addEventListener('error', () => img.replaceWith(cadangan));
    img.src = item.foto;
    return img;
  }

  // ======================================================================
  // State & server
  // ======================================================================
  const S = {
    token: null,
    sesi: null,
    toko: null,
    produk: [],
    kategori: [],
    semuaItem: null,
    filterKategori: '',
    keranjang: [],
    metode: 'Tunai',
    notaTerakhir: null,
    notaDilihat: null,
    pengguna: null,
    jumlahMenipis: 0,
    gayaStruk: '',
    billAktif: null,
    dasbor: null,
    laporan: null,
    itemDiedit: null,
    resepEdit: [],
    pinWajib: false,
  };

  function panggil(nama, args) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler((res) => {
          if (res && res.ok) resolve(res.data);
          else reject(res || { kode: 'SERVER', pesan: 'Respons server tidak valid (' + nama + ').' });
        })
        .withFailureHandler((err) => {
          // Gagal sebelum kode server kita berjalan (izin, deployment, jaringan). Tampilkan detail asli untuk diagnosis.
          const detail = err && err.message ? String(err.message) : String(err || '');
          console.error('google.script.run ' + nama + ' gagal:', err);
          reject({ kode: 'JARINGAN', pesan: 'Gagal terhubung ke server (' + nama + '). ' + (detail ? 'Detail: ' + detail : 'Periksa koneksi lalu coba lagi.') });
        });
      try {
        // Panggil sebagai metode runner (this = runner), bukan apply(null): runner asli Google bergantung pada this.
        runner[nama].apply(runner, args);
      } catch (e) {
        reject({ kode: 'JARINGAN', pesan: 'Gagal memanggil server (' + nama + '): ' + e.message });
      }
    });
  }

  async function api(nama, ...args) {
    try {
      return await panggil(nama, [S.token].concat(args));
    } catch (g) {
      if (g.kode === 'SESI_HABIS') {
        g.ditangani = true;
        keluarLokal(g.pesan);
      } else if (g.kode === 'WAJIB_GANTI_PIN') {
        g.ditangani = true;
        tampilGantiPin(true);
      } else if (g.kode === 'SHIFT_TUTUP') {
        // Pesan tetap ditampilkan pemanggil; indikator & banner disegarkan.
        S.shiftAktif = null;
        renderIndikatorShift();
      }
      throw g;
    }
  }

  function tanganiGalat(g, elPesan) {
    if (g && g.ditangani) return;
    const pesan = (g && g.pesan) || 'Terjadi kesalahan.';
    if (elPesan) elPesan.textContent = pesan;
    else toast(pesan, 'galat');
  }

  const isAdmin = () => S.sesi && S.sesi.role === 'Admin';
  const modeRetail = () => S.toko && S.toko.mode === 'Retail';
  const kosong = (teks) => h('div', { class: 'kosong', text: teks });
  /** Seperti replaceChildren, tetapi membuang null/false (replaceChildren menjadikannya teks "null"). */
  const isiWadah = (wadah, ...anak) => wadah.replaceChildren(...anak.flat().filter((a) => a !== null && a !== undefined && a !== false));
  // ---------- Kerangka memuat (skeleton) ----------
  /** Placeholder berkedip selama data dimuat; lebih tenang daripada teks "Memuat…". */
  function kerangkaMemuat(baris) {
    const n = baris || 3;
    const el = h('div', { class: 'skeleton-wadah', role: 'status', 'aria-label': 'Memuat' });
    for (let i = 0; i < n; i++) el.append(h('div', { class: 'skeleton', style: 'width:' + (100 - (i % 3) * 18) + '%' }));
    return el;
  }

  // ---------- Aksesibilitas modal: fokus masuk, Tab terkurung, fokus kembali ----------
  const FOKUSABLE = 'button:not([disabled]), [href], input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
  const asalFokus = new Map();
  // Pengamat berjalan SETELAH kode pembuka memindahkan fokus ke dalam modal, jadi asal fokus
  // dicatat terus-menerus dari elemen terakhir yang difokus di luar modal.
  let fokusLuarTerakhir = null;
  const catatFokusLuar = (el) => { if (el && el.closest && !el.closest('.modal') && el !== document.body) fokusLuarTerakhir = el; };
  document.addEventListener('focusin', (e) => catatFokusLuar(e.target));
  // Klik & tombol keyboard (mis. F9) tetap tercatat walau event fokus tidak terpicu.
  // Hanya klik asli (bukan .click() dari kode, mis. F9) agar F9 dari kolom cari kembali ke kolom cari.
  document.addEventListener('click', (e) => { if (e.isTrusted) catatFokusLuar(e.target.closest('button, a, input, select, textarea, [tabindex]')); }, true);
  document.addEventListener('keydown', (e) => catatFokusLuar(e.target), true);
  const terlihat = (el) => el.offsetParent !== null || el.getClientRects().length > 0;
  const pengamatModal = new MutationObserver((perubahan) => perubahan.forEach((m) => {
    const modal = m.target;
    if (!modal.hidden) {
      if (!asalFokus.has(modal)) asalFokus.set(modal, fokusLuarTerakhir);
      // Tunggu isi modal dirender; jangan timpa fokus yang sudah diatur pemanggil (mis. kolom uang).
      setTimeout(() => {
        if (modal.hidden || modal.contains(document.activeElement)) return;
        const awal = modal.querySelector('[data-fokus-awal]') || Array.from(modal.querySelectorAll(FOKUSABLE)).find(terlihat);
        if (awal) awal.focus();
      }, 30);
    } else {
      const asal = asalFokus.get(modal);
      asalFokus.delete(modal);
      if (asal && document.contains(asal) && terlihat(asal) && !$$('.modal').some((x) => !x.hidden)) asal.focus();
    }
  }));
  $$('.modal').forEach((m) => pengamatModal.observe(m, { attributes: true, attributeFilter: ['hidden'] }));
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const modal = $$('.modal').filter((m) => !m.hidden).pop();
    if (!modal) return;
    const el = Array.from(modal.querySelectorAll(FOKUSABLE)).filter(terlihat);
    if (!el.length) return;
    const pertama = el[0];
    const terakhir = el[el.length - 1];
    if (e.shiftKey && (document.activeElement === pertama || !modal.contains(document.activeElement))) {
      e.preventDefault();
      terakhir.focus();
    } else if (!e.shiftKey && (document.activeElement === terakhir || !modal.contains(document.activeElement))) {
      e.preventDefault();
      pertama.focus();
    }
  });

  // ---------- Kartu "Mulai cepat" (toko baru) ----------
  function renderMulaiCepat(p) {
    const wadah = $('#db-mulai');
    let disembunyikan = false;
    try { disembunyikan = localStorage.getItem('pos_mulai_sembunyi') === '1'; } catch (e) { /* abaikan */ }
    const langkah = [
      { selesai: !p.namaBawaan, teks: 'Isi nama, alamat & pengaturan toko', tombol: 'Pengaturan', ke: 'admin' },
      { selesai: p.jumlahItem > 0, teks: 'Tambah item jualan (atau jalankan POS › Contoh Data di Spreadsheet)', tombol: 'Item', ke: 'item' },
      { selesai: p.jumlahKasir > 0, teks: 'Buat akun kasir', tombol: 'Pengguna', ke: 'admin' },
      { selesai: p.adaTransaksi, teks: 'Lakukan transaksi pertama', tombol: 'Kasir', ke: 'kasir' },
    ];
    const sisa = langkah.filter((l) => !l.selesai).length;
    if (!sisa || disembunyikan) {
      wadah.replaceChildren();
      return;
    }
    wadah.replaceChildren(h('div', { class: 'kartu mulai-cepat' },
      h('div', { class: 'kepala-kartu' },
        h('h2', { text: 'Mulai cepat · ' + (langkah.length - sisa) + '/' + langkah.length + ' selesai' }),
        h('button', {
          type: 'button', class: 'tombol teks kecil', text: 'Sembunyikan',
          onclick: () => { try { localStorage.setItem('pos_mulai_sembunyi', '1'); } catch (e) { /* abaikan */ } wadah.replaceChildren(); },
        })),
      h('ol', { class: 'daftar-langkah' }, langkah.map((l) => h('li', { class: l.selesai ? 'selesai' : null },
        h('span', { class: 'penanda', 'aria-hidden': 'true' }, l.selesai ? ikon('centang') : null),
        h('span', { class: 'teks' }, h('span', { class: 'sr-only', text: l.selesai ? 'Selesai: ' : 'Belum: ' }), l.teks),
        l.selesai ? null : h('button', { type: 'button', class: 'tombol kecil', text: l.tombol, onclick: () => pindahLayar(l.ke) }))))));
  }

  /** 'YYYY-MM-DD' hari ini menurut zona waktu toko. */
  const hariIniToko = () => new Intl.DateTimeFormat('en-CA', {
    timeZone: (S.toko && S.toko.zonaWaktu) || 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit',
  }).format(new Date());
  function formatInputUang(e) {
    const n = parseUang(e.target.value);
    e.target.value = n ? angka(n) : '';
  }
  /** Semua item (termasuk Bahan & nonaktif) untuk layar Admin; dimuat sekali lalu diperbarui lokal. */
  async function pastikanSemuaItem() {
    if (!S.semuaItem) S.semuaItem = await api('listItem', {});
    return S.semuaItem;
  }

  // ======================================================================
  // Login, ganti PIN, keluar
  // ======================================================================
  function tampilSatu(id) {
    ['#layar-login', '#layar-pin', '#aplikasi'].forEach((s) => { $(s).hidden = s !== id; });
  }

  function tampilLogin(pesan) {
    tampilSatu('#layar-login');
    $('#login-pesan').textContent = pesan || '';
    $('#login-pin').value = '';
    $('#login-username').focus();
  }

  function tampilGantiPin(wajib) {
    S.pinWajib = wajib;
    tampilSatu('#layar-pin');
    $('#form-pin').reset();
    $('#pin-pesan').textContent = '';
    $('#pin-info').textContent = wajib
      ? 'Demi keamanan, ganti PIN sementara Anda sebelum melanjutkan.'
      : 'Masukkan PIN lama dan PIN baru Anda.';
    $('#pin-batal').hidden = wajib;
    $('#pin-lama').focus();
  }

  function keluarLokal(pesan) {
    S.token = null;
    S.sesi = null;
    S.navPeran = null;
    penyimpan.hapus('pos_token');
    tutupModal();
    tampilLogin(pesan);
  }

  $('#form-login').addEventListener('submit', (e) => {
    e.preventDefault();
    const tombol = e.submitter || $('#form-login button[type=submit]');
    const username = $('#login-username').value.trim();
    const pin = $('#login-pin').value.trim();
    $('#login-pesan').textContent = '';
    if (!username || !/^\d{4,6}$/.test(pin)) {
      $('#login-pesan').textContent = 'Isi username dan PIN (4–6 digit).';
      return;
    }
    denganTombol(tombol, 'Memeriksa…', async () => {
      try {
        const d = await panggil('login', [username, pin]);
        S.token = d.token;
        penyimpan.taruh('pos_token', d.token);
        if (d.wajibGantiPin) tampilGantiPin(true);
        else await masukAplikasi();
      } catch (g) {
        $('#login-pin').value = '';
        tanganiGalat(g, $('#login-pesan'));
      }
    });
  });

  $('#form-pin').addEventListener('submit', (e) => {
    e.preventDefault();
    const lama = $('#pin-lama').value.trim();
    const baru = $('#pin-baru').value.trim();
    const pesan = $('#pin-pesan');
    pesan.textContent = '';
    if (!/^\d{4,6}$/.test(baru)) { pesan.textContent = 'PIN baru harus 4–6 digit angka.'; return; }
    if (baru !== $('#pin-ulang').value.trim()) { pesan.textContent = 'Ulangi PIN baru tidak sama.'; return; }
    denganTombol(e.submitter || $('#form-pin button[type=submit]'), 'Menyimpan…', async () => {
      try {
        await api('gantiPin', lama, baru);
        toast('PIN berhasil diganti.', 'sukses');
        if (S.pinWajib || !S.sesi) await masukAplikasi();
        else tampilSatu('#aplikasi');
      } catch (g) {
        tanganiGalat(g, pesan);
      }
    });
  });

  $('#pin-batal').addEventListener('click', () => tampilSatu('#aplikasi'));

  // ======================================================================
  // Masuk aplikasi & navigasi
  // ======================================================================
  // Menu aplikasi, berkelompok (judul grup tampil di sidebar lebar).
  // hp = kandidat navigasi bawah HP (maks 4 + "Lainnya"; batas <= 5 item sesuai pedoman UX).
  const MENU = [
    { id: 'dashboard', grup: 'Menu utama', label: 'Beranda', judul: 'Beranda', admin: true, hp: true },
    { id: 'kasir', grup: 'Menu utama', label: 'Kasir', judul: 'Kasir', hp: true },
    { id: 'item', grup: 'Inventori', label: 'Item', judul: 'Item & harga', admin: true },
    { id: 'stok', grup: 'Inventori', label: 'Stok', judul: 'Stok', admin: true, hp: true, badge: 'stok' },
    { id: 'nota', grup: 'Transaksi', label: 'Nota', judul: 'Nota & transaksi', hp: true },
    { id: 'kas', grup: 'Transaksi', label: 'Kas', judul: 'Kas & tutup kasir', hp: true },
    { id: 'laporan', grup: 'Laporan & sistem', label: 'Laporan', judul: 'Laporan penjualan', admin: true },
    { id: 'admin', grup: 'Laporan & sistem', label: 'Admin', judul: 'Pengaturan & pengguna', admin: true },
  ];
  const LAYAR_ADMIN = ['dashboard', 'item', 'form-item', 'stok', 'laporan', 'admin'];

  // Ikon garis 24x24 (statis, bukan data pengguna).
  const IKON = {
    dashboard: [['rect', { x: 3, y: 3, width: 7, height: 9, rx: 1.5 }], ['rect', { x: 14, y: 3, width: 7, height: 5, rx: 1.5 }],
      ['rect', { x: 14, y: 12, width: 7, height: 9, rx: 1.5 }], ['rect', { x: 3, y: 16, width: 7, height: 5, rx: 1.5 }]],
    kasir: [['circle', { cx: 9, cy: 20, r: 1.5 }], ['circle', { cx: 18, cy: 20, r: 1.5 }],
      ['path', { d: 'M2 3h3l2.7 12.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.5L21 8H6' }]],
    nota: [['path', { d: 'M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z' }], ['path', { d: 'M9 7h6M9 11h6M9 15h4' }]],
    item: [['path', { d: 'M21 8 12 3 3 8v8l9 5 9-5z' }], ['path', { d: 'm3 8 9 5 9-5M12 13v8' }]],
    stok: [['path', { d: 'M3 21V9l9-6 9 6v12' }], ['path', { d: 'M7 21v-8h10v8M7 17h10' }]],
    laporan: [['path', { d: 'M3 20h18' }], ['path', { d: 'M6 16v-5M11 16V6M16 16v-8M21 16v-3' }]],
    admin: [['path', { d: 'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1' }],
      ['circle', { cx: 15, cy: 6, r: 2 }], ['circle', { cx: 9, cy: 12, r: 2 }], ['circle', { cx: 17, cy: 18, r: 2 }]],
    lainnya: [['circle', { cx: 5, cy: 12, r: 1.3 }], ['circle', { cx: 12, cy: 12, r: 1.3 }], ['circle', { cx: 19, cy: 12, r: 1.3 }]],
    kas: [['rect', { x: 2, y: 6, width: 20, height: 14, rx: 2 }], ['path', { d: 'M2 10h20M6 15h4' }], ['path', { d: 'M6 6l3-3h6l3 3' }]],
    tutup: [['path', { d: 'M6 6l12 12M18 6 6 18' }]],
    centang: [['path', { d: 'm5 12.5 4.5 4.5L19 7.5' }]],
  };

  const SVG_NS = 'http://www.w3.org/2000/svg';
  /** Seperti h(), untuk elemen SVG. Teks lewat textContent. */
  function sv(tag, atribut, ...anak) {
    const el = document.createElementNS(SVG_NS, tag);
    Object.keys(atribut || {}).forEach((k) => {
      const v = atribut[k];
      if (v === null || v === undefined) return;
      if (k === 'text') el.textContent = v;
      else el.setAttribute(k, v);
    });
    anak.flat().forEach((a) => { if (a) el.append(a); });
    return el;
  }

  function ikon(nama) {
    return sv('svg', {
      viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 2,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true',
    }, (IKON[nama] || []).map((b) => sv(b[0], b[1])));
  }

  function bangunNavigasi() {
    const boleh = MENU.filter((m) => !m.admin || isAdmin());
    const tombol = (m) => h('button', { type: 'button', dataset: { nav: m.id }, title: m.judul || m.label },
      ikon(m.id), h('span', { text: m.label }),
      m.badge ? h('span', { class: 'lencana-nav', dataset: { badge: m.badge }, hidden: true }) : null);
    const samping = [];
    boleh.forEach((m, i) => {
      if (i === 0 || boleh[i - 1].grup !== m.grup) samping.push(h('div', { class: 'sb-grup', text: m.grup }));
      samping.push(tombol(m));
    });
    $('#nav-samping').replaceChildren(...samping);
    const bawah = boleh.filter((m) => m.hp).slice(0, 4);
    const lain = boleh.filter((m) => bawah.indexOf(m) === -1);
    isiWadah($('#nav-bawah'), bawah.map(tombol), lain.length ? tombol({ id: 'lainnya', label: 'Lainnya', judul: 'Menu lainnya' }) : null);
    $('#isi-lainnya').replaceChildren(...lain.map((m) => h('button', { type: 'button', dataset: { nav: m.id } }, ikon(m.id), h('span', { text: m.judul }))));
    aturBadgeMenipis(S.jumlahMenipis);
    tandaiNavAktif();
  }

  function tandaiNavAktif() {
    const navAktif = layarAktif === 'form-item' ? 'item' : layarAktif;
    $$('[data-nav]').forEach((b) => {
      const aktif = b.dataset.nav === navAktif;
      b.classList.toggle('aktif', aktif);
      if (aktif) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    const diLainnya = !$$('#nav-bawah [data-nav]').some((b) => b.dataset.nav === navAktif);
    $$('[data-nav="lainnya"]').forEach((b) => b.classList.toggle('aktif', diLainnya));
  }

  async function masukAplikasi() {
    memuat(true);
    try {
      const d = await api('muatAwal');
      terapkanDataAwal(d);
      tampilSatu('#aplikasi');
      pulihkanKeranjang();
      // Admin mendarat di Beranda (ringkasan hari ini); kasir langsung ke layar Kasir.
      pindahLayar(isAdmin() ? 'dashboard' : 'kasir');
    } finally {
      memuat(false);
    }
  }

  function terapkanDataAwal(d) {
    S.toko = d.toko;
    S.sesi = d.sesi;
    S.produk = d.items;
    S.kategori = d.kategori;
    S.jumlahMenipis = d.jumlahMenipis || 0;
    S.shiftAktif = d.shiftAktif || null;
    S.terakhirMuat = Date.now();
    const namaUser = S.sesi.nama || S.sesi.username;
    document.title = S.toko.nama || 'POS';
    $('#sb-nama-toko').textContent = S.toko.nama || 'POS';
    $('#sb-nama').textContent = namaUser;
    $('#sb-role').textContent = S.sesi.role;
    $('#sb-avatar').textContent = inisial(namaUser);
    $('#akun-avatar').textContent = inisial(namaUser);
    $('#akun-label').textContent = namaUser;
    $('#akun-nama').textContent = namaUser;
    $('#akun-role').textContent = S.sesi.username + ' · ' + S.sesi.role;
    $$('[data-admin]').forEach((el) => { el.hidden = !isAdmin(); });
    // Ukuran kertas dipilih di dialog cetak; di sini hanya lebar area cetak (58mm -> 48mm, 80mm -> 72mm).
    S.gayaStruk = '@page { margin: 0; } @media print { #struk { width: ' +
      (S.toko.lebarStruk === 80 ? '72mm; margin: 0 4mm' : '48mm; margin: 0 5mm') + '; } }';
    $('#label-pajak').textContent = 'Pajak ' + angka(S.toko.pajakPersen) + '%';
    // Mode Retail: sembunyikan tipe Bahan/Menu di filter daftar item.
    $('#filter-tipe').hidden = modeRetail();
    if (modeRetail()) $('#filter-tipe').value = '';
    const dl = $('#daftar-kategori');
    dl.replaceChildren(...S.kategori.map((k) => h('option', { value: k })));
    // Bangun menu hanya bila peran berubah; menyusun ulang tiap penyegaran membuat navigasi berkedip.
    if (S.navPeran !== S.sesi.role) {
      S.navPeran = S.sesi.role;
      bangunNavigasi();
    } else {
      aturBadgeMenipis(S.jumlahMenipis);
    }
    renderIndikatorShift();
    $('#sub-layar').textContent = S.toko.nama;
    perbaruiJam();
    renderKategori();
    renderProduk();
    renderKeranjang();
  }

  /** Muat ulang daftar produk di latar (harga/stok terbaru) tanpa mengganggu keranjang. */
  async function segarkanProduk(tampilkanPesan) {
    try {
      const d = await api('muatAwal');
      terapkanDataAwal(d);
      if (tampilkanPesan) toast('Data diperbarui.', 'sukses');
    } catch (g) {
      if (tampilkanPesan) tanganiGalat(g);
    }
  }

  function perbaruiJam() {
    if (!S.toko) return;
    $('#jam-toko').textContent = new Intl.DateTimeFormat('id-ID', {
      timeZone: S.toko.zonaWaktu, weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
    }).format(new Date());
  }
  setInterval(perbaruiJam, 30000);

  let layarAktif = 'kasir';
  function pindahLayar(nama) {
    if (LAYAR_ADMIN.indexOf(nama) !== -1 && !isAdmin()) nama = 'kasir';
    layarAktif = nama;
    $$('[data-layar]').forEach((el) => { el.hidden = el.dataset.layar !== nama; });
    tandaiNavAktif();
    const menu = MENU.find((m) => m.id === (nama === 'form-item' ? 'item' : nama));
    $('#judul-layar').textContent = menu ? menu.judul : '';
    $('#bilah-keranjang').hidden = nama !== 'kasir' || !S.keranjang.length;
    if (nama === 'dashboard') bukaDashboard();
    // Kasir lain bisa menjual item yang sama: segarkan stok/harga di latar bila data > 1 menit.
    if (nama === 'kasir' && Date.now() - (S.terakhirMuat || 0) > 60000) segarkanProduk(false);
    if (nama === 'kasir') segarkanBill();
    if (nama === 'item') bukaDaftarItem();
    if (nama === 'stok') bukaStok();
    if (nama === 'nota') bukaNota();
    if (nama === 'laporan') bukaLaporan();
    if (nama === 'kas') bukaKas();
    if (nama === 'admin') bukaAdmin();
    window.scrollTo(0, 0);
  }

  // Satu pendengar untuk semua tombol navigasi (sidebar, nav bawah, lembar Lainnya).
  document.addEventListener('click', (e) => {
    const b = e.target.closest && e.target.closest('[data-nav]');
    if (!b) return;
    const tujuan = b.dataset.nav;
    if (tujuan === 'lainnya') {
      $('#modal-lainnya').hidden = false;
      return;
    }
    $('#modal-lainnya').hidden = true;
    // Masuk ke menu Item/Stok dari navigasi selalu memuat data segar (stok berubah karena penjualan).
    if (tujuan === 'item' || tujuan === 'stok') S.semuaItem = null;
    pindahLayar(tujuan);
  });
  $('#tutup-lainnya').addEventListener('click', () => { $('#modal-lainnya').hidden = true; });

  // ---------- Pintasan keyboard (kasir di laptop/PC) ----------
  const sedangMengetik = (el) => !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
  document.addEventListener('keydown', (e) => {
    if ($('#aplikasi').hidden) return;
    const modalTerbuka = $$('.modal').find((m) => !m.hidden);
    if (e.key === 'Escape') {
      if (modalTerbuka) {
        modalTerbuka.hidden = true;
        if (modalTerbuka.id === 'modal-pin-sementara') $('#ps-pin').textContent = '';
      } else if ($('#panel-keranjang').classList.contains('terbuka')) {
        $('#panel-keranjang').classList.remove('terbuka');
      } else {
        $('#menu-akun').hidden = true;
      }
      return;
    }
    if (e.key === 'F2' || (e.key === '/' && !sedangMengetik(e.target))) {
      e.preventDefault();
      if (modalTerbuka) return;
      if (layarAktif !== 'kasir') pindahLayar('kasir');
      $('#cari-produk').focus();
      $('#cari-produk').select();
      return;
    }
    if (e.key === 'F9') {
      e.preventDefault();
      if (!$('#modal-bayar').hidden) $('#proses-bayar').click();
      else if (!modalTerbuka && layarAktif === 'kasir' && S.keranjang.length) $('#tombol-bayar').click();
      return;
    }
    if (e.key === 'Enter' && !$('#modal-bayar').hidden && e.target.id === 'bayar-nilai') {
      e.preventDefault();
      $('#proses-bayar').click();
      return;
    }
    if (e.key === 'Enter' && !$('#modal-sukses').hidden && e.target.tagName !== 'BUTTON') {
      e.preventDefault();
      $('#sukses-baru').click();
    }
  });

  $('#tombol-akun').addEventListener('click', (e) => {
    e.stopPropagation();
    $('#menu-akun').hidden = !$('#menu-akun').hidden;
  });
  document.addEventListener('click', (e) => {
    if (!$('#menu-akun').hidden && !$('#menu-akun').contains(e.target)) $('#menu-akun').hidden = true;
  });
  $('#menu-akun').addEventListener('click', async (e) => {
    const aksi = e.target.dataset && e.target.dataset.aksi;
    if (!aksi) return;
    $('#menu-akun').hidden = true;
    if (aksi === 'ganti-pin') tampilGantiPin(false);
    if (aksi === 'printer') { renderPilihanPrinter(); $('#modal-printer').hidden = false; }
    if (aksi === 'muat-ulang') {
      memuat(true);
      await segarkanProduk(true);
      memuat(false);
    }
    if (aksi === 'keluar') keluarAkun();
  });

  async function keluarAkun() {
    if (S.keranjang.length && !confirm('Keranjang masih berisi item. Tetap keluar?')) return;
    try { await api('logout'); } catch (g) { /* tetap keluar */ }
    S.keranjang = [];
    S.infoShift = null;
    S.pengguna = null;
    simpanKeranjang();
    keluarLokal('');
  }
  $('#sb-keluar').addEventListener('click', keluarAkun);

  // ======================================================================
  // Kasir: produk
  // ======================================================================
  function renderKategori() {
    const ada = {};
    S.produk.forEach((p) => { if (p.kategori) ada[p.kategori] = true; });
    const daftar = Object.keys(ada).sort();
    if (S.filterKategori && !ada[S.filterKategori]) S.filterKategori = '';
    const wadah = $('#filter-kategori');
    wadah.hidden = daftar.length < 2;
    wadah.replaceChildren(...[''].concat(daftar).map((k) => h('button', {
      type: 'button',
      class: 'chip' + (S.filterKategori === k ? ' aktif' : ''),
      text: k || 'Semua',
      onclick: () => { S.filterKategori = k; renderKategori(); renderProduk(); },
    })));
  }

  function produkTersaring() {
    const q = $('#cari-produk').value.trim().toLowerCase();
    return S.produk.filter((p) => {
      if (S.filterKategori && p.kategori !== S.filterKategori) return false;
      if (q && (p.nama + ' ' + p.kode).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function dilacakLangsung(p) { return p.lacak && p.tipe === 'Barang'; }

  function renderProduk() {
    const daftar = produkTersaring();
    const qtyKeranjang = {};
    S.keranjang.forEach((b) => { qtyKeranjang[b.idItem] = b.qty; });
    const grid = $('#grid-produk');
    if (!daftar.length) {
      grid.replaceChildren(h('div', { class: 'kosong', text: S.produk.length ? 'Tidak ada item yang cocok.' : 'Belum ada item untuk dijual. Admin dapat menambah item di menu Item.' }));
      return;
    }
    grid.replaceChildren(...daftar.map((p) => {
      let stok = null;
      if (dilacakLangsung(p)) {
        if (p.stok <= 0) stok = h('span', { class: 'stok-produk habis', text: 'Habis' });
        else stok = h('span', { class: 'stok-produk' + (p.menipis ? ' menipis' : ''), text: 'Stok ' + angka(p.stok) + ' ' + p.satuan });
      }
      return h('button', {
        type: 'button',
        class: 'kartu-produk' + (dilacakLangsung(p) && p.stok <= 0 && !S.toko.izinkanStokMinus ? ' habis' : ''),
        onclick: () => tambahKeKeranjang(p, 1),
      },
      gambarItem(p),
      h('span', { class: 'nama-produk', text: p.nama }),
      stok,
      h('span', { class: 'harga-produk', text: rupiah(p.hargaJual) }),
      qtyKeranjang[p.id] ? h('span', { class: 'qty-di-keranjang', text: angka(qtyKeranjang[p.id]) }) : null);
    }));
  }

  let timerCari = null;
  $('#cari-produk').addEventListener('input', () => {
    clearTimeout(timerCari);
    timerCari = setTimeout(renderProduk, 120);
  });
  // Enter: cocok persis dengan kode (scanner barcode) atau satu-satunya hasil -> masuk keranjang.
  $('#cari-produk').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const q = e.target.value.trim().toLowerCase();
    if (!q) return;
    const persis = S.produk.find((p) => p.kode && p.kode.toLowerCase() === q);
    if (persis) {
      masukkanKode(persis.kode);
      e.target.value = '';
      renderProduk();
      return;
    }
    const hasil = produkTersaring();
    if (hasil.length === 1) {
      tambahKeKeranjang(hasil[0], 1);
      e.target.value = '';
      renderProduk();
    } else if (!hasil.length) {
      toast('Item "' + e.target.value.trim() + '" tidak ditemukan.', 'galat');
    }
  });

  // ======================================================================
  // Kasir: keranjang
  // ======================================================================
  function simpanKeranjang() {
    penyimpan.taruh('pos_keranjang', {
      items: S.keranjang.map((b) => ({ idItem: b.idItem, qty: b.qty })),
      diskon: { jenis: $('#jenis-diskon').value, nilai: $('#nilai-diskon').value },
      catatan: $('#catatan-trx').value,
      bill: S.billAktif,
    });
  }

  function pulihkanKeranjang() {
    const data = penyimpan.ambil('pos_keranjang', null);
    S.keranjang = [];
    if (!data) { renderKeranjang(); return; }
    let hilang = 0;
    (data.items || []).forEach((b) => {
      const p = S.produk.find((x) => x.id === b.idItem);
      if (p) S.keranjang.push({ idItem: p.id, nama: p.nama, harga: p.hargaJual, satuan: p.satuan, qty: b.qty });
      else hilang++;
    });
    if (data.diskon) {
      $('#jenis-diskon').value = data.diskon.jenis === 'persen' ? 'persen' : 'nominal';
      $('#nilai-diskon').value = data.diskon.nilai || '';
    }
    $('#catatan-trx').value = data.catatan || '';
    S.billAktif = data.bill || null;
    if (hilang) toast(hilang + ' item di keranjang sudah tidak tersedia dan dihapus.', 'galat');
    renderKeranjang();
    renderProduk();
  }

  function stokCukup(p, qty) {
    if (S.toko.izinkanStokMinus || !dilacakLangsung(p)) return true;
    return qty <= p.stok;
  }

  function tambahKeKeranjang(p, tambah) {
    const baris = S.keranjang.find((b) => b.idItem === p.id);
    const qtyBaru = bulatQty((baris ? baris.qty : 0) + tambah);
    if (!stokCukup(p, qtyBaru)) {
      toast('Stok ' + p.nama + ' tidak cukup (tersisa ' + angka(p.stok) + ' ' + p.satuan + ').', 'galat');
      return;
    }
    if (baris) baris.qty = qtyBaru;
    else S.keranjang.push({ idItem: p.id, nama: p.nama, harga: p.hargaJual, satuan: p.satuan, qty: qtyBaru });
    // Getar hanya setelah ada sentuhan pengguna (browser memblokir sebelum itu).
    if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(15);
    perbaruiKeranjang();
  }

  function ubahQty(idItem, qty) {
    const baris = S.keranjang.find((b) => b.idItem === idItem);
    if (!baris) return;
    const p = S.produk.find((x) => x.id === idItem);
    if (!Number.isFinite(qty)) { renderKeranjang(); return; }
    qty = bulatQty(qty);
    if (qty <= 0) {
      const posisi = S.keranjang.indexOf(baris);
      S.keranjang = S.keranjang.filter((b) => b.idItem !== idItem);
      toast(baris.nama + ' dihapus dari keranjang.', '', {
        label: 'Urungkan',
        fn: () => {
          if (S.keranjang.some((b) => b.idItem === idItem)) return;
          S.keranjang.splice(Math.min(posisi, S.keranjang.length), 0, baris);
          perbaruiKeranjang();
        },
      });
    } else if (p && !stokCukup(p, qty)) {
      toast('Stok ' + p.nama + ' tidak cukup (tersisa ' + angka(p.stok) + ' ' + p.satuan + ').', 'galat');
    } else {
      baris.qty = qty;
    }
    perbaruiKeranjang();
  }

  function perbaruiKeranjang() {
    simpanKeranjang();
    renderKeranjang();
    renderProduk();
  }

  /** Hitungan tampilan saja; angka final selalu dihitung ulang di server. */
  function hitungRingkas() {
    const subtotal = S.keranjang.reduce((s, b) => s + bulatUang(b.harga * b.qty), 0);
    const jenis = $('#jenis-diskon').value;
    const nilai = jenis === 'persen' ? Math.min(100, parseQty($('#nilai-diskon').value) || 0) : parseUang($('#nilai-diskon').value);
    const diskon = Math.min(subtotal, jenis === 'persen' ? bulatUang(subtotal * nilai / 100) : bulatUang(nilai));
    const pajak = bulatUang((subtotal - diskon) * (S.toko ? S.toko.pajakPersen : 0) / 100);
    return { subtotal, diskon, pajak, total: subtotal - diskon + pajak, jenis, nilai };
  }

  function renderKeranjang() {
    const wadah = $('#daftar-keranjang');
    if (!S.keranjang.length) {
      wadah.replaceChildren(h('div', { class: 'kosong', text: 'Keranjang kosong. Ketuk item untuk menambahkan.' }));
    } else {
      wadah.replaceChildren(...S.keranjang.map((b) => h('div', { class: 'baris-keranjang' },
        h('div', null,
          h('div', { class: 'nama', text: b.nama }),
          h('div', { class: 'harga', text: rupiah(b.harga) + ' / ' + b.satuan })),
        h('div', { class: 'subtotal', text: rupiah(bulatUang(b.harga * b.qty)) }),
        h('div', { class: 'kontrol-qty' },
          h('button', { type: 'button', class: 'tombol', 'aria-label': 'Kurangi', text: '−', onclick: () => ubahQty(b.idItem, b.qty - 1) }),
          h('input', {
            value: angka(b.qty), inputmode: 'decimal', 'aria-label': 'Qty ' + b.nama,
            onchange: (e) => ubahQty(b.idItem, parseQty(e.target.value)),
            onfocus: (e) => e.target.select(),
          }),
          h('button', { type: 'button', class: 'tombol', 'aria-label': 'Tambah', text: '+', onclick: () => {
            const p = S.produk.find((x) => x.id === b.idItem);
            if (p) tambahKeKeranjang(p, 1);
          } })),
        h('button', { type: 'button', class: 'tombol teks kecil', text: 'Hapus', onclick: () => ubahQty(b.idItem, 0) }))));
    }
    const r = hitungRingkas();
    $('#rincian-subtotal').textContent = rupiah(r.subtotal);
    $('#rincian-diskon').textContent = '−' + rupiah(r.diskon);
    $('#baris-rincian-diskon').hidden = !r.diskon;
    $('#rincian-pajak').textContent = rupiah(r.pajak);
    $('#baris-rincian-pajak').hidden = !(S.toko && S.toko.pajakPersen > 0);
    $('#rincian-total').textContent = rupiah(r.total);
    $('#tombol-bayar').disabled = !S.keranjang.length;
    const jumlah = S.keranjang.reduce((s, b) => s + b.qty, 0);
    $('#bilah-info').textContent = angka(jumlah) + ' item · ' + rupiah(r.total);
    $('#bilah-keranjang').hidden = layarAktif !== 'kasir' || !S.keranjang.length;
    renderInfoBill();
  }

  ['#jenis-diskon', '#nilai-diskon'].forEach((s) => $(s).addEventListener('input', () => { simpanKeranjang(); renderKeranjang(); }));
  $('#catatan-trx').addEventListener('input', simpanKeranjang);

  // Tanpa dialog konfirmasi: cukup "Urungkan" (lebih cepat untuk kasir, tetap aman).
  $('#kosongkan-keranjang').addEventListener('click', () => {
    if (!S.keranjang.length) return;
    const cadangan = {
      items: S.keranjang.slice(), jenis: $('#jenis-diskon').value, nilai: $('#nilai-diskon').value, catatan: $('#catatan-trx').value,
      bill: S.billAktif,
    };
    kosongkanKeranjang();
    toast('Keranjang dikosongkan.', '', {
      label: 'Urungkan',
      fn: () => {
        S.keranjang = cadangan.items;
        S.billAktif = cadangan.bill;
        $('#jenis-diskon').value = cadangan.jenis;
        $('#nilai-diskon').value = cadangan.nilai;
        $('#catatan-trx').value = cadangan.catatan;
        perbaruiKeranjang();
      },
    });
  });

  function kosongkanKeranjang() {
    S.keranjang = [];
    S.billAktif = null;
    $('#nilai-diskon').value = '';
    $('#jenis-diskon').value = 'nominal';
    $('#catatan-trx').value = '';
    perbaruiKeranjang();
  }

  $('#bilah-keranjang').addEventListener('click', () => $('#panel-keranjang').classList.add('terbuka'));
  $('#tutup-keranjang').addEventListener('click', () => $('#panel-keranjang').classList.remove('terbuka'));

  // ======================================================================
  // Kasir: pembayaran
  // ======================================================================
  function tutupModal() {
    $$('.modal').forEach((m) => { m.hidden = true; });
  }

  $('#tombol-bayar').addEventListener('click', () => {
    if (!S.keranjang.length) return;
    const r = hitungRingkas();
    if (r.jenis === 'nominal' && r.nilai > r.subtotal) { toast('Diskon melebihi subtotal.', 'galat'); return; }
    $('#bayar-total').textContent = rupiah(r.total);
    $('#bayar-nilai').value = '';
    $('#bayar-referensi').value = '';
    $('#bayar-pesan').textContent = '';
    pilihMetode('Tunai');
    renderNominalCepat(r.total);
    $('#modal-bayar').hidden = false;
    $('#bayar-nilai').focus();
  });

  $('#tutup-bayar').addEventListener('click', () => { $('#modal-bayar').hidden = true; });

  function pilihMetode(m) {
    S.metode = m;
    $$('#pilih-metode button').forEach((b) => b.classList.toggle('aktif', b.dataset.metode === m));
    $('#bagian-tunai').hidden = m !== 'Tunai';
    $('#bagian-nontunai').hidden = m === 'Tunai';
    perbaruiKembalian();
  }
  $$('#pilih-metode button').forEach((b) => b.addEventListener('click', () => pilihMetode(b.dataset.metode)));

  function renderNominalCepat(total) {
    const pilihan = [];
    const tambah = (n, label) => { if (n >= total && !pilihan.some((p) => p.n === n)) pilihan.push({ n, label }); };
    tambah(total, 'Uang pas');
    [5000, 10000].forEach((k) => tambah(Math.ceil(total / k) * k));
    [20000, 50000, 100000].forEach((n) => tambah(n));
    tambah(Math.ceil(total / 100000) * 100000);
    $('#nominal-cepat').replaceChildren(...pilihan.slice(0, 6).map((p) => h('button', {
      type: 'button', class: 'tombol', text: p.label || angka(p.n),
      onclick: () => { $('#bayar-nilai').value = angka(p.n); perbaruiKembalian(); },
    })));
  }

  function perbaruiKembalian() {
    const total = hitungRingkas().total;
    const bayar = parseUang($('#bayar-nilai').value);
    const kotak = $('#kotak-kembalian');
    if (bayar < total) {
      kotak.classList.add('kurang');
      $('#label-kembalian').textContent = 'Kurang';
      $('#bayar-kembalian').textContent = rupiah(total - bayar);
    } else {
      kotak.classList.remove('kurang');
      $('#label-kembalian').textContent = 'Kembalian';
      $('#bayar-kembalian').textContent = rupiah(bayar - total);
    }
  }
  $('#bayar-nilai').addEventListener('input', (e) => {
    const n = parseUang(e.target.value);
    e.target.value = n ? angka(n) : '';
    perbaruiKembalian();
  });

  $('#proses-bayar').addEventListener('click', (e) => {
    const r = hitungRingkas();
    const bayar = S.metode === 'Tunai' ? parseUang($('#bayar-nilai').value) : r.total;
    const pesan = $('#bayar-pesan');
    pesan.textContent = '';
    if (S.metode === 'Tunai' && bayar < r.total) { pesan.textContent = 'Uang diterima kurang dari total.'; return; }
    const data = {
      items: S.keranjang.map((b) => ({ idItem: b.idItem, qty: b.qty })),
      diskon: { jenis: r.jenis, nilai: r.nilai },
      metode: S.metode,
      bayar: bayar,
      referensi: $('#bayar-referensi').value.trim(),
      catatan: $('#catatan-trx').value.trim(),
      idBill: S.billAktif ? S.billAktif.id : '',
      versiBill: S.billAktif ? S.billAktif.versi : '',
    };
    denganTombol(e.currentTarget, 'Memproses…', async () => {
      try {
        const nota = await api('buatTransaksi', data);
        transaksiSukses(nota);
      } catch (g) {
        tanganiGalat(g, pesan);
        // Harga/stok mungkin berubah di server; segarkan daftar produk di latar.
        if (g.kode === 'STOK_KURANG' || g.kode === 'TIDAK_ADA' || g.kode === 'VALIDASI') segarkanProduk(false);
        if (g.kode === 'KONFLIK') segarkanBill();
      }
    });
  });

  function transaksiSukses(nota) {
    Object.keys(nota.stokBaru || {}).forEach((id) => {
      const p = S.produk.find((x) => x.id === id);
      if (p) p.stok = nota.stokBaru[id];
    });
    S.notaTerakhir = nota;
    kosongkanKeranjang();
    $('#panel-keranjang').classList.remove('terbuka');
    $('#modal-bayar').hidden = true;
    $('#sukses-nota').textContent = nota.noNota + ' · ' + rupiah(nota.total) + ' · ' + nota.metode;
    $('#sukses-kembalian').hidden = nota.metode !== 'Tunai';
    $('#sukses-kembalian-nilai').textContent = rupiah(nota.kembalian);
    $('#modal-sukses').hidden = false;
    segarkanProduk(false);
    segarkanBill();
  }

  $('#sukses-cetak').addEventListener('click', () => { if (S.notaTerakhir) cetakStruk(S.notaTerakhir); });
  $('#sukses-baru').addEventListener('click', () => {
    $('#modal-sukses').hidden = true;
    $('#cari-produk').focus();
  });

  // ======================================================================
  // Struk
  // ======================================================================
  function isiStruk(nota) {
    const t = nota.toko;
    const garis = () => h('div', { class: 's-garis' });
    const baris = (kiri, kanan, kelas) => h('div', { class: 's-baris' + (kelas ? ' ' + kelas : '') }, h('span', { text: kiri }), h('span', { text: kanan }));
    return [
      h('div', { class: 's-tengah s-tebal s-besar', text: t.nama }),
      t.alamat ? h('div', { class: 's-tengah', text: t.alamat }) : null,
      t.telepon ? h('div', { class: 's-tengah', text: 'Telp. ' + t.telepon }) : null,
      garis(),
      baris('No', nota.noNota),
      baris('Tanggal', nota.tanggal),
      baris('Kasir', nota.kasir),
      nota.status === 'Batal' ? h('div', { class: 's-tengah s-tebal', text: '*** TRANSAKSI DIBATALKAN ***' }) : null,
      garis(),
      nota.items.map((i) => h('div', null,
        h('div', { text: i.nama }),
        baris('  ' + angka(i.qty) + ' x ' + angka(i.harga), angka(i.subtotal)))),
      garis(),
      baris('Subtotal', angka(nota.subtotal)),
      nota.diskon ? baris('Diskon', '-' + angka(nota.diskon)) : null,
      nota.pajak ? baris('Pajak', angka(nota.pajak)) : null,
      baris('TOTAL', rupiah(nota.total), 's-total'),
      baris(nota.metode, angka(nota.bayar)),
      nota.metode === 'Tunai' ? baris('Kembalian', angka(nota.kembalian)) : null,
      nota.referensi ? baris('Ref', nota.referensi) : null,
      nota.catatan ? h('div', { text: 'Catatan: ' + nota.catatan }) : null,
      garis(),
      t.footer ? h('div', { class: 's-tengah', text: t.footer }) : null,
    ].flat().filter(Boolean);
  }

  /** Pilih apa yang dicetak lewat kelas body; CSS @media print menyembunyikan sisanya. */
  function cetakDengan(mode, gayaKertas) {
    document.body.classList.remove('cetak-struk', 'cetak-laporan', 'cetak-label');
    document.body.classList.add('cetak-' + mode);
    $('#gaya-kertas').textContent = gayaKertas || (mode === 'struk' ? S.gayaStruk : '@page { size: A4; margin: 12mm; }');
    // Beri waktu browser merender sebelum dialog cetak.
    setTimeout(() => window.print(), 60);
  }
  window.addEventListener('afterprint', () => document.body.classList.remove('cetak-struk', 'cetak-laporan', 'cetak-label'));

  function cetakStruk(nota) {
    cetakTeksAtauHtml(nota.teks, isiStruk(nota));
  }

  // ======================================================================
  // Nota: daftar transaksi, detail, cetak ulang, void (Admin)
  // ======================================================================
  async function bukaNota() {
    $('#nt-info-kasir').hidden = isAdmin();
    if (isAdmin()) {
      if (!$('#nt-dari').value) {
        $('#nt-dari').value = hariIniToko();
        $('#nt-sampai').value = hariIniToko();
      }
      if (!S.pengguna) muatPengguna();
    }
    await tampilTransaksi();
  }

  function isiPilihanKasir() {
    const sel = $('#nt-kasir');
    const pilih = sel.value;
    sel.replaceChildren(h('option', { value: '', text: 'Semua kasir' }),
      ...(S.pengguna || []).map((p) => h('option', { value: p.username, text: p.nama })));
    sel.value = pilih;
  }

  const layarLebar = () => window.matchMedia('(min-width: 900px)').matches;
  // Pindah antara tabel (desktop) dan kartu (HP) bila lebar layar melewati batas.
  let lebarSebelumnya = null;
  window.addEventListener('resize', () => {
    const kini = layarLebar();
    if (lebarSebelumnya !== null && kini !== lebarSebelumnya && layarAktif === 'nota' && S.daftarNota) tampilTransaksi();
    lebarSebelumnya = kini;
  });

  async function tampilTransaksi() {
    const f = { q: $('#nt-cari').value.trim() };
    lebarSebelumnya = layarLebar();
    if (isAdmin()) {
      Object.assign(f, { dari: $('#nt-dari').value, sampai: $('#nt-sampai').value, kasir: $('#nt-kasir').value, status: $('#nt-status').value });
    }
    const wadah = $('#nt-daftar');
    wadah.replaceChildren(kerangkaMemuat(5));
    try {
      const d = await api('listTransaksi', f);
      $('#nt-ringkas').replaceChildren(
        h('div', null, h('small', { text: 'Transaksi' }), h('b', { text: angka(d.ringkas.jumlah) })),
        h('div', null, h('small', { text: 'Penjualan' }), h('b', { text: rupiah(d.ringkas.total) })),
        h('div', null, h('small', { text: 'Batal' }), h('b', { text: angka(d.ringkas.batal) })));
      if (!d.baris.length) {
        wadah.replaceChildren(kosong('Tidak ada transaksi pada rentang ini.'));
        return;
      }
      S.daftarNota = d;
      if (layarLebar()) {
        isiWadah(wadah, h('div', { class: 'kartu', style: 'padding:6px 4px' }, h('div', { class: 'tabel-gulung' }, tabelKlik(
          [{ judul: 'No. nota' }, { judul: 'Waktu' }, { judul: 'Kasir' }, { judul: 'Metode' }, { judul: 'Status' }, { judul: 'Total', kanan: true }],
          d.baris.map((n) => ({ sel: [n.noNota, n.tanggal, n.kasir, n.metode, n.status, rupiah(n.total)], klik: () => bukaDetailNota(n.noNota) }))))),
        d.penuh ? h('p', { class: 'bantu', text: 'Menampilkan 300 transaksi terbaru. Persempit rentang tanggal untuk melihat lainnya.' }) : null);
        $$('#nt-daftar tbody tr').forEach((tr, i) => { if (d.baris[i].status === 'Batal') tr.classList.add('batal'); });
        return;
      }
      isiWadah(wadah, d.baris.map((n) => h('button', {
        type: 'button', class: 'baris-nota' + (n.status === 'Batal' ? ' batal' : ''), onclick: () => bukaDetailNota(n.noNota),
      },
      h('span', { class: 'kiri' }, h('b', { text: n.noNota }), h('br'), h('small', { text: n.tanggal + ' · ' + n.kasir + ' · ' + n.metode })),
      h('span', { class: 'kanan' },
        h('b', { text: rupiah(n.total) }),
        n.status === 'Batal' ? h('div', null, h('span', { class: 'lencana batal', text: 'Batal' })) : null))),
      d.penuh ? h('p', { class: 'bantu', text: 'Menampilkan 300 transaksi terbaru. Persempit rentang tanggal untuk melihat lainnya.' }) : null);
    } catch (g) {
      wadah.replaceChildren(kosong((g && g.pesan) || 'Gagal memuat transaksi.'));
    }
  }

  async function bukaDetailNota(no) {
    memuat(true);
    try {
      tampilDetailNota(await api('getNota', no));
    } catch (g) {
      tanganiGalat(g);
    } finally {
      memuat(false);
    }
  }

  function tampilDetailNota(nota) {
    S.notaDilihat = nota;
    $('#isi-modal-nota').replaceChildren(...isiStruk(nota));
    $('#bagian-void').hidden = !(isAdmin() && nota.status !== 'Batal');
    $('#void-alasan').value = '';
    $('#void-pesan').textContent = '';
    $('#modal-nota').hidden = false;
  }

  $('#nt-tampil').addEventListener('click', tampilTransaksi);
  $('#nt-cari').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    tampilTransaksi();
  });
  $('#tutup-modal-nota').addEventListener('click', () => { $('#modal-nota').hidden = true; });
  $('#nota-cetak').addEventListener('click', () => { if (S.notaDilihat) cetakStruk(S.notaDilihat); });
  $('#void-proses').addEventListener('click', (e) => {
    const alasan = $('#void-alasan').value.trim();
    const pesan = $('#void-pesan');
    pesan.textContent = '';
    if (!alasan) { pesan.textContent = 'Isi alasan pembatalan.'; return; }
    if (!confirm('Batalkan nota ' + S.notaDilihat.noNota + '? Stok akan dikembalikan.')) return;
    denganTombol(e.currentTarget, 'Memproses…', async () => {
      try {
        tampilDetailNota(await api('voidTransaksi', S.notaDilihat.noNota, alasan));
        toast('Nota dibatalkan, stok dikembalikan.', 'sukses');
        tampilTransaksi();
        segarkanProduk(false);
      } catch (g) {
        tanganiGalat(g, pesan);
      }
    });
  });

  // ======================================================================
  // Stok (Admin): masuk, opname, riwayat, menipis
  // ======================================================================
  let tabStok = 'masuk';
  const isiOpname = {}; // idItem -> teks stok fisik yang diketik (bertahan saat filter berubah)
  let riwayatDimuat = false;

  function aturBadgeMenipis(n) {
    S.jumlahMenipis = n;
    $$('[data-badge="stok"]').concat([$('#badge-menipis-tab')]).forEach((el) => {
      el.hidden = !n;
      el.textContent = n > 99 ? '99+' : String(n);
    });
  }

  async function bukaStok() {
    try {
      await pastikanSemuaItem();
    } catch (g) {
      tanganiGalat(g);
      return;
    }
    pilihTabStok(tabStok);
  }

  function pilihTabStok(tab) {
    tabStok = tab;
    $$('#tab-stok button').forEach((b) => b.classList.toggle('aktif', b.dataset.tab === tab));
    $$('[data-tab-isi]').forEach((el) => { el.hidden = el.dataset.tabIsi !== tab; });
    if (tab === 'masuk') renderPilihanMasuk();
    if (tab === 'opname') renderOpname();
    if (tab === 'riwayat') siapkanRiwayat();
    if (tab === 'menipis') tampilMenipis();
    if (tab === 'persediaan') tampilPersediaan();
  }
  $$('#tab-stok button').forEach((b) => b.addEventListener('click', () => pilihTabStok(b.dataset.tab)));

  /** Item yang punya stok sendiri (bukan Menu) dan aktif. */
  const itemBerstok = () => (S.semuaItem || []).filter((i) => i.tipe !== 'Menu' && i.aktif);

  // ---------- Stok masuk ----------
  function renderPilihanMasuk(idPilih) {
    const q = $('#sm-cari').value.trim().toLowerCase();
    const sel = $('#sm-item');
    const pilih = idPilih || sel.value;
    const daftar = itemBerstok().filter((i) => !q || (i.nama + ' ' + i.kode + ' ' + i.id).toLowerCase().indexOf(q) !== -1);
    sel.replaceChildren(h('option', { value: '', text: daftar.length ? '— pilih item —' : 'Tidak ada item yang cocok' }),
      ...daftar.map((i) => h('option', { value: i.id, text: i.nama + ' · ' + angka(i.stok) + ' ' + i.satuan })));
    sel.value = daftar.some((i) => i.id === pilih) ? pilih : (daftar.length === 1 ? daftar[0].id : '');
    infoMasuk();
  }

  function infoMasuk() {
    const it = (S.semuaItem || []).find((i) => i.id === $('#sm-item').value);
    $('#sm-info').textContent = it
      ? 'Stok saat ini ' + angka(it.stok) + ' ' + it.satuan + ' · harga beli ' + rupiah(it.hargaBeli) + ' / ' + it.satuan +
        (it.lacak ? '' : ' · stok item ini tidak dilacak')
      : '';
  }

  $('#sm-cari').addEventListener('input', () => renderPilihanMasuk());
  $('#sm-item').addEventListener('change', infoMasuk);
  $('#sm-harga').addEventListener('input', formatInputUang);

  $('#form-masuk').addEventListener('submit', (e) => {
    e.preventDefault();
    const pesan = $('#sm-pesan');
    pesan.textContent = '';
    const idItem = $('#sm-item').value;
    const qty = parseQty($('#sm-qty').value);
    const hargaTeks = $('#sm-harga').value.trim();
    if (!idItem) { pesan.textContent = 'Pilih item terlebih dahulu.'; return; }
    if (!(qty > 0)) { pesan.textContent = 'Isi qty lebih dari 0.'; return; }
    denganTombol(e.submitter || $('#form-masuk button[type=submit]'), 'Menyimpan…', async () => {
      try {
        const r = await api('stokMasuk', {
          idItem: idItem, qty: qty, hargaBeli: hargaTeks ? parseUang(hargaTeks) : '',
          ref: $('#sm-ref').value, ket: $('#sm-ket').value,
        });
        ['#sm-qty', '#sm-harga', '#sm-ref', '#sm-ket'].forEach((sel) => { $(sel).value = ''; });
        toast('Stok ' + r.nama + ' sekarang ' + angka(r.stok) + '.' + (r.hppMenuBerubah ? ' HPP ' + r.hppMenuBerubah + ' menu ikut diperbarui.' : ''), 'sukses');
        // HPP menu bisa ikut berubah di server: muat ulang daftar item agar semua angka segar.
        S.semuaItem = null;
        await pastikanSemuaItem();
        renderPilihanMasuk(r.idItem);
        segarkanProduk(false);
      } catch (g) {
        tanganiGalat(g, pesan);
      }
    });
  });

  // ---------- Opname ----------
  function renderOpname() {
    const semua = itemBerstok().filter((i) => i.lacak);
    const selKat = $('#op-kategori');
    const pilihKat = selKat.value;
    const kategori = Array.from(new Set(semua.map((i) => i.kategori).filter(Boolean))).sort();
    selKat.replaceChildren(h('option', { value: '', text: 'Semua kategori' }), ...kategori.map((k) => h('option', { value: k, text: k })));
    selKat.value = kategori.indexOf(pilihKat) !== -1 ? pilihKat : '';
    const q = $('#op-cari').value.trim().toLowerCase();
    const daftar = semua.filter((i) => (!selKat.value || i.kategori === selKat.value) &&
      (!q || (i.nama + ' ' + i.kode + ' ' + i.id).toLowerCase().indexOf(q) !== -1));
    $('#op-daftar').replaceChildren(...(daftar.length ? daftar.map(barisOpname) : [kosong('Tidak ada item yang dilacak stoknya.')]));
    perbaruiTombolOpname();
  }

  function barisOpname(i) {
    const selisih = h('div', { class: 'selisih' });
    const baris = h('div', { class: 'baris-opname' },
      h('div', null, h('b', { text: i.nama }), h('div', { class: 'meta', text: 'Sistem: ' + angka(i.stok) + ' ' + i.satuan }), selisih),
      h('input', {
        inputmode: 'decimal', placeholder: angka(i.stok), value: isiOpname[i.id] || '', 'aria-label': 'Stok fisik ' + i.nama,
        oninput: (e) => { isiOpname[i.id] = e.target.value; tandai(); perbaruiTombolOpname(); },
      }));
    function tandai() {
      const v = String(isiOpname[i.id] || '').trim();
      baris.classList.toggle('berubah', v !== '');
      if (!v) { selisih.textContent = ''; return; }
      const n = parseQty(v);
      if (!Number.isFinite(n) || n < 0) {
        selisih.textContent = 'Angka tidak valid';
        selisih.className = 'selisih minus';
        return;
      }
      const d = bulatQty(n - i.stok);
      selisih.textContent = d === 0 ? 'Sesuai' : (d > 0 ? '+' : '') + angka(d) + ' ' + i.satuan;
      selisih.className = 'selisih ' + (d > 0 ? 'plus' : d < 0 ? 'minus' : '');
    }
    tandai();
    return baris;
  }

  const entriOpname = () => Object.keys(isiOpname).filter((id) => String(isiOpname[id]).trim() !== '');

  function perbaruiTombolOpname() {
    const n = entriOpname().length;
    $('#op-simpan').textContent = n ? 'Simpan opname (' + n + ' item)' : 'Simpan opname';
    $('#op-simpan').disabled = !n;
  }

  $('#op-cari').addEventListener('input', renderOpname);
  $('#op-kategori').addEventListener('change', renderOpname);
  $('#op-simpan').addEventListener('click', async (e) => {
    const pesan = $('#op-pesan');
    pesan.textContent = '';
    const baris = [];
    for (const id of entriOpname()) {
      const n = parseQty(isiOpname[id]);
      if (!Number.isFinite(n) || n < 0) { pesan.textContent = 'Ada stok fisik yang tidak valid.'; return; }
      baris.push({ idItem: id, stokFisik: n });
    }
    if (!baris.length) return;
    if (!confirm('Simpan opname untuk ' + baris.length + ' item? Stok sistem akan disamakan dengan stok fisik.')) return;
    await denganTombol(e.currentTarget, 'Menyimpan…', async () => {
      try {
        const hasil = await api('opname', baris, $('#op-ket').value);
        hasil.forEach((x) => {
          const it = S.semuaItem.find((i) => i.id === x.idItem);
          if (it) it.stok = x.stokFisik;
          delete isiOpname[x.idItem];
        });
        const berubah = hasil.filter((x) => x.selisih !== 0).length;
        $('#op-ket').value = '';
        toast('Opname tersimpan: ' + berubah + ' item disesuaikan, ' + (hasil.length - berubah) + ' sudah sesuai.', 'sukses');
        segarkanProduk(false);
      } catch (g) {
        tanganiGalat(g, pesan);
      }
    });
    renderOpname();
  });

  // ---------- Riwayat ----------
  function siapkanRiwayat() {
    const sel = $('#rw-item');
    const pilih = sel.value;
    sel.replaceChildren(h('option', { value: '', text: 'Semua item' }),
      ...(S.semuaItem || []).filter((i) => i.tipe !== 'Menu').map((i) => h('option', { value: i.id, text: i.nama })));
    sel.value = pilih;
    if (!$('#rw-dari').value) {
      $('#rw-dari').value = hariIniToko();
      $('#rw-sampai').value = hariIniToko();
    }
    if (!riwayatDimuat) {
      riwayatDimuat = true;
      tampilRiwayat();
    }
  }

  async function tampilRiwayat() {
    const wadah = $('#rw-daftar');
    wadah.replaceChildren(kerangkaMemuat(5));
    try {
      const d = await api('listStokLog', {
        idItem: $('#rw-item').value, jenis: $('#rw-jenis').value, dari: $('#rw-dari').value, sampai: $('#rw-sampai').value,
      });
      if (!d.baris.length) {
        wadah.replaceChildren(kosong('Tidak ada riwayat stok pada rentang ini.'));
        return;
      }
      isiWadah(wadah, d.baris.map(kartuLog),
        d.penuh ? h('p', { class: 'bantu', text: 'Menampilkan 200 catatan terbaru. Persempit filter untuk melihat lainnya.' }) : null);
    } catch (g) {
      wadah.replaceChildren(kosong((g && g.pesan) || 'Gagal memuat riwayat.'));
    }
  }

  function kartuLog(l) {
    const plus = l.qty > 0;

  // ======================================================================
  // Grafik (SVG tanpa pustaka): satu seri, satu warna (--seri, divalidasi terang & gelap)
  // ======================================================================
  const persen = (x) => angka(Math.round(x * 1000) / 10) + '%';
  const geserHari = (ymd, n) => {
    const d = new Date(ymd + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  const HARI_PENDEK = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
  const labelHari = (ymd) => {
    const d = new Date(ymd + 'T00:00:00Z');
    return HARI_PENDEK[d.getUTCDay()] + ' ' + d.getUTCDate();
  };
  const tanggalPanjang = (ymd) => new Intl.DateTimeFormat('id-ID', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC',
  }).format(new Date(ymd + 'T00:00:00Z'));

  /** Label sumbu ringkas: 1,2 jt / 850 rb. */
  function ringkasAngka(n) {
    const a = Math.abs(n);
    if (a >= 1e9) return angka(Math.round(n / 1e8) / 10) + ' M';
    if (a >= 1e6) return angka(Math.round(n / 1e5) / 10) + ' jt';
    if (a >= 1e3) return angka(Math.round(n / 100) / 10) + ' rb';
    return angka(n);
  }

  /** Batas atas sumbu yang "bulat" (1, 2, 2,5, 5 × 10^n). */
  function batasAtas(maks, bulat) {
    if (bulat) return Math.max(4, Math.ceil(maks / 4) * 4);
    if (maks <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(maks)));
    const n = maks / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }

  /** Batang dengan ujung atas membulat 4px, menempel di garis dasar. */
  function jalurBatang(x, yAtas, w, tinggi) {
    const r = Math.min(4, w / 2, tinggi);
    return 'M' + x + ',' + (yAtas + tinggi) + ' V' + (yAtas + r) + ' Q' + x + ',' + yAtas + ' ' + (x + r) + ',' + yAtas +
      ' H' + (x + w - r) + ' Q' + (x + w) + ',' + yAtas + ' ' + (x + w) + ',' + (yAtas + r) + ' V' + (yAtas + tinggi) + ' Z';
  }

  /**
   * Grafik batang satu seri.
   * data: [{label, nilai, judul, detail}]; opsi: {tinggi, format, sorot (indeks berlabel nilai), bulat, label}
   * Hover/fokus/ketuk menampilkan tooltip; label nilai hanya pada batang yang disorot (bukan semua batang).
   */
  function grafikBatang(wadah, data, opsi) {
    const o = opsi || {};
    const W = Math.max(wadah.clientWidth || 0, 280);
    const H = o.tinggi || 200;
    const kiri = 46;
    const kanan = 6;
    const atas = 20;
    const bawah = 24;
    const lebarPlot = W - kiri - kanan;
    const tinggiPlot = H - atas - bawah;
    const maks = batasAtas(Math.max(0, ...data.map((d) => d.nilai)), o.bulat);
    const y = (v) => atas + tinggiPlot - (v / maks) * tinggiPlot;
    const band = lebarPlot / Math.max(data.length, 1);
    const lebarBatang = Math.max(2, Math.min(36, band * 0.62));
    const fmt = o.format || ringkasAngka;
    const setiap = Math.max(1, Math.ceil(data.length / Math.max(1, Math.floor(lebarPlot / 38))));

    const svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img', 'aria-label': o.label || 'Grafik batang' });
    for (let i = 0; i <= 4; i++) {
      const v = (maks * i) / 4;
      svg.append(
        sv('line', { class: i === 0 ? 'g-dasar' : 'g-grid', x1: kiri, x2: W - kanan, y1: y(v), y2: y(v) }),
        sv('text', { x: kiri - 8, y: y(v) + 4, 'text-anchor': 'end', text: fmt(v) }));
    }
    const tooltip = h('div', { class: 'tooltip-grafik', hidden: true });
    data.forEach((d, i) => {
      const x0 = kiri + band * i;
      const cx = x0 + band / 2;
      const kolom = sv('g', { class: 'g-kolom' + (o.sorot === i ? ' fokus' : ''), tabindex: 0, 'aria-label': d.judul + ': ' + d.detail });
      kolom.append(sv('rect', { class: 'g-latar', x: x0 + 1, y: atas, width: Math.max(band - 2, 1), height: tinggiPlot, rx: 4 }));
      if (d.nilai > 0) kolom.append(sv('path', { class: 'g-batang', d: jalurBatang(cx - lebarBatang / 2, y(d.nilai), lebarBatang, y(0) - y(d.nilai)) }));
      if (o.sorot === i && d.nilai > 0) kolom.append(sv('text', { class: 'g-nilai', x: cx, y: y(d.nilai) - 6, 'text-anchor': 'middle', text: fmt(d.nilai) }));
      if (i % setiap === 0) svg.append(sv('text', { x: cx, y: H - 6, 'text-anchor': 'middle', text: d.label }));
      const tampil = () => {
        tooltip.replaceChildren(h('b', { text: d.judul }), d.detail);
        tooltip.style.left = Math.min(Math.max((cx / W) * 100, 12), 88) + '%';
        tooltip.style.top = Math.max(y(d.nilai) - 10, 0) + 'px';
        tooltip.hidden = false;
      };
      const sembunyi = () => { tooltip.hidden = true; };
      kolom.addEventListener('mouseenter', tampil);
      kolom.addEventListener('focus', tampil);
      kolom.addEventListener('click', tampil);
      kolom.addEventListener('mouseleave', sembunyi);
      kolom.addEventListener('blur', sembunyi);
      svg.append(kolom);
    });
    wadah.replaceChildren(svg, tooltip);
    wadah._lebar = wadah.clientWidth;
    wadah._render = () => grafikBatang(wadah, data, o);
  }

  /** Daftar bar horizontal (HTML): label, nilai, lintasan. */
  function daftarBar(wadah, baris, format, teksKosong) {
    const maks = Math.max(0, ...baris.map((b) => b.nilai));
    if (!baris.length || maks === 0) {
      wadah.replaceChildren(h('p', { class: 'bantu', style: 'margin:0', text: teksKosong || 'Belum ada data.' }));
      return;
    }
    wadah.replaceChildren(...baris.map((b) => {
      const isi = h('div', { class: 'isi' });
      isi.style.width = ((b.nilai / maks) * 100) + '%';
      return h('div', { class: 'baris-bar' },
        h('span', { class: 'nama', text: b.nama }), h('span', { class: 'nilai', text: format(b.nilai) }),
        h('div', { class: 'lintasan' }, isi), b.catatan ? h('small', { text: b.catatan }) : null);
    }));
  }

  function tabelData(kolom, baris, kaki) {
    const sel = (tag, v, i) => h(tag, { class: kolom[i].kanan ? 'kanan' : null, text: v });
    return h('table', { class: 'tabel-data' },
      h('thead', null, h('tr', null, kolom.map((k, i) => sel('th', k.judul, i)))),
      h('tbody', null, baris.map((r) => h('tr', null, r.map((v, i) => sel('td', v, i))))),
      kaki ? h('tfoot', null, h('tr', null, kaki.map((v, i) => sel('td', v, i)))) : null);
  }

  function kartuKpi(label, nilai, catatan) {
    return h('div', { class: 'kpi' }, h('div', { class: 'label', text: label }), h('div', { class: 'nilai', text: nilai }),
      catatan ? h('div', { class: 'catatan' }, catatan) : null);
  }

  /** Perubahan vs pembanding: panah + persen + teks (tidak mengandalkan warna saja). */
  function delta(sekarang, lalu, teksLalu) {
    if (!lalu) return sekarang ? 'belum ada data ' + teksLalu : '—';
    // Hari baru dimulai: "turun 100%" menyesatkan, cukup keterangan netral.
    if (!sekarang) return 'belum ada hari ini';
    const p = Math.round(((sekarang - lalu) / lalu) * 100);
    const naik = p >= 0;
    return h('span', null, h('span', { class: 'delta ' + (naik ? 'naik' : 'turun'), text: (naik ? '▲ ' : '▼ ') + Math.abs(p) + '%' }), ' vs ' + teksLalu);
  }

  let timerUkuran = null;
  window.addEventListener('resize', () => {
    clearTimeout(timerUkuran);
    timerUkuran = setTimeout(() => $$('.grafik').forEach((w) => {
      if (w._render && w.offsetParent && w.clientWidth !== w._lebar) w._render();
    }), 150);
  });

  function renderDashboard(d) {
    renderMulaiCepat(d.penyiapan);
    const hi = d.hariIni;
    const km = d.kemarin;
    $('#db-kpi').replaceChildren(
      kartuKpi('Penjualan hari ini', rupiah(hi.omzet), delta(hi.omzet, km.omzet, 'kemarin')),
      kartuKpi('Transaksi', angka(hi.jumlah), delta(hi.jumlah, km.jumlah, 'kemarin')),
      kartuKpi('Laba kotor', rupiah(hi.labaKotor), hi.margin === null ? 'margin —' : 'margin ' + persen(hi.margin)),
      kartuKpi('Rata-rata / transaksi', rupiah(hi.rataRata), hi.batal ? hi.batal + ' nota batal' : 'tanpa nota batal'));

    grafikBatang($('#db-grafik-7'), d.tujuhHari.map((x) => ({
      label: labelHari(x.tanggal), nilai: x.omzet, judul: tanggalPanjang(x.tanggal),

    })), { sorot: d.tujuhHari.length - 1, tinggi: 210, label: 'Penjualan 7 hari terakhir' });

    // Jam ramai: tampilkan rentang jam yang ada transaksinya (minimal 08–20).
    const aktif = d.perJam.filter((j) => j.jumlah > 0).map((j) => j.jam);
    const dari = Math.min(8, aktif.length ? Math.min(...aktif) : 8);
    const sampai = Math.max(20, aktif.length ? Math.max(...aktif) : 20);
    const jamData = d.perJam.slice(dari, sampai + 1);
    const puncak = jamData.reduce((p, j, i) => (j.jumlah > jamData[p].jumlah ? i : p), 0);
    const dua = (n) => String(n).padStart(2, '0');
    grafikBatang($('#db-grafik-jam'), jamData.map((j) => ({
      label: dua(j.jam), nilai: j.jumlah, judul: 'Pukul ' + dua(j.jam) + '.00–' + dua(j.jam) + '.59',
      detail: angka(j.jumlah) + ' transaksi · ' + rupiah(j.omzet),
    })), { format: angka, bulat: true, tinggi: 180, sorot: jamData[puncak].jumlah ? puncak : null, label: 'Jumlah transaksi per jam' });

    daftarBar($('#db-metode'), d.perMetodeHariIni.map((m) => ({ nama: m.metode, nilai: m.total, catatan: angka(m.jumlah) + ' transaksi' })),

    daftarBar($('#db-terlaris'), d.terlaris.map((t) => ({ nama: t.nama, nilai: t.qty, catatan: rupiah(t.omzet) })),
      angka, 'Belum ada penjualan 7 hari terakhir.');

    isiWadah($('#db-menipis'), d.menipis.daftar.length
      ? d.menipis.daftar.map((i) => h('div', { class: 'kartu-log' },
        h('div', { class: 'tengah' }, h('b', { text: i.nama }), h('span', { class: 'qty-minus', text: angka(i.stok) + ' ' + i.satuan })),
        h('div', { class: 'bawah', text: 'Minimum ' + angka(i.stokMin) + ' ' + i.satuan })))
      : [h('p', { class: 'bantu', style: 'margin:0', text: 'Semua stok aman.' })],
    d.menipis.jumlah > d.menipis.daftar.length ? h('p', { class: 'bantu', style: 'margin:0', text: '+' + (d.menipis.jumlah - d.menipis.daftar.length) + ' item lainnya' }) : null);

    isiWadah($('#db-terakhir'), d.terakhir.length
      ? d.terakhir.map((n) => h('button', { type: 'button', class: 'baris-nota' + (n.status === 'Batal' ? ' batal' : ''), onclick: () => bukaDetailNota(n.noNota) },
        h('span', { class: 'kiri' }, h('b', { text: n.noNota }), h('br'), h('small', { text: n.waktu.slice(11) + ' · ' + n.kasir + ' · ' + n.metode })),
        h('span', { class: 'kanan' }, h('b', { text: rupiah(n.total) }), n.status === 'Batal' ? h('div', null, h('span', { class: 'lencana batal', text: 'Batal' })) : null)))
      : [h('p', { class: 'bantu', style: 'margin:0', text: 'Belum ada transaksi 7 hari terakhir.' })]);
  }

  // ======================================================================
  // Laporan (Admin)
  // ======================================================================
  const PRESET = [['hari', 'Hari ini'], ['kemarin', 'Kemarin'], ['7', '7 hari'], ['30', '30 hari'], ['bulan', 'Bulan ini'], ['bulanLalu', 'Bulan lalu']];
  let presetAktif = '7';
  let laporanDimuat = false;

  function rentangPreset(k) {
    const hi = hariIniToko();
    const awalBulan = hi.slice(0, 8) + '01';
    if (k === 'hari') return { dari: hi, sampai: hi };
    if (k === 'kemarin') return { dari: geserHari(hi, -1), sampai: geserHari(hi, -1) };
    if (k === '30') return { dari: geserHari(hi, -29), sampai: hi };
    if (k === 'bulan') return { dari: awalBulan, sampai: hi };
    if (k === 'bulanLalu') {
      const akhirLalu = geserHari(awalBulan, -1);
      return { dari: akhirLalu.slice(0, 8) + '01', sampai: akhirLalu };
    }
    return { dari: geserHari(hi, -6), sampai: hi };
  }

  function renderPreset() {
    $('#lp-preset').replaceChildren(...PRESET.map((p) => h('button', {
      type: 'button', class: 'chip' + (presetAktif === p[0] ? ' aktif' : ''), text: p[1], onclick: () => pilihPreset(p[0]),
    })));
  }

  function pilihPreset(k) {
    presetAktif = k;
    const r = rentangPreset(k);
    $('#lp-dari').value = r.dari;
    $('#lp-sampai').value = r.sampai;
    renderPreset();
    tampilLaporan();
  }

  function bukaLaporan() {
    renderPreset();
    if (!laporanDimuat) pilihPreset(presetAktif);
    else if (S.laporan) renderLaporan(S.laporan);
  }

  ['#lp-dari', '#lp-sampai'].forEach((sel) => $(sel).addEventListener('change', () => {
    presetAktif = '';
    renderPreset();
  }));
  $('#lp-tampil').addEventListener('click', () => tampilLaporan());

  async function tampilLaporan() {
    laporanDimuat = true;
    $('#lp-hasil-ekspor').replaceChildren();
    $('#lp-kpi').replaceChildren(kosong('Menghitung laporan…'));
    try {
      S.laporan = await api('laporanRingkas', { dari: $('#lp-dari').value, sampai: $('#lp-sampai').value });
      if (layarAktif === 'laporan') renderLaporan(S.laporan);
    } catch (g) {
      $('#lp-kpi').replaceChildren(kosong((g && g.pesan) || 'Gagal memuat laporan.'));
    }
  }

  function renderLaporan(d) {
    const r = d.rentang;
    $('#lp-judul-cetak').textContent = 'Laporan Penjualan — ' + S.toko.nama;
    $('#lp-sub-cetak').textContent = 'Periode ' + tanggalPanjang(r.dari) + (r.dari !== r.sampai ? ' s.d. ' + tanggalPanjang(r.sampai) : '');
    const kpiLabaBersih = kartuKpi('Laba bersih (perkiraan)', rupiah(d.labaBersih), 'laba kotor + pendapatan lain − biaya');
    kpiLabaBersih.classList.add('aksen');
    const kpiBatal = kartuKpi('Nota batal', angka(d.batal.jumlah), rupiah(d.batal.total) + ' tidak dihitung');
    if (d.batal.jumlah) kpiBatal.classList.add('bahaya');
    $('#lp-kpi').replaceChildren(
      kartuKpi('Penjualan', rupiah(d.omzet), 'diskon ' + rupiah(d.diskon) + ' · pajak ' + rupiah(d.pajak)),
      kartuKpi('Laba kotor', rupiah(d.labaKotor), 'HPP ' + rupiah(d.hpp) + (d.margin === null ? '' : ' · margin ' + persen(d.margin))),
      kpiLabaBersih,
      kartuKpi('Transaksi', angka(d.jumlah), 'rata-rata ' + rupiah(d.rataRata)),
      kartuKpi('Biaya usaha', rupiah(d.kas.biaya), 'pendapatan lain ' + rupiah(d.kas.pendapatanLain)),
      kpiBatal);
    daftarBar($('#lp-kas'), d.kas.perKategori.map((k) => ({
      nama: k.jenis + ' · ' + k.kategori, nilai: k.total, catatan: angka(k.jumlah) + ' catatan',
    })), rupiah, 'Belum ada catatan kas pada periode ini.');

    const banyak = d.perHari.length > 14;
    grafikBatang($('#lp-grafik'), d.perHari.map((x) => ({
      label: banyak ? String(Number(x.tanggal.slice(8))) : labelHari(x.tanggal), nilai: x.omzet, judul: tanggalPanjang(x.tanggal),
      detail: rupiah(x.omzet) + ' · ' + angka(x.jumlah) + ' trx · laba ' + rupiah(x.laba),
    })), { tinggi: 230, label: 'Penjualan per hari' });

    $('#lp-tabel-hari-isi').replaceChildren(tabelData(
      [{ judul: 'Tanggal' }, { judul: 'Transaksi', kanan: true }, { judul: 'Penjualan', kanan: true }, { judul: 'Laba kotor', kanan: true }],
      d.perHari.map((x) => [labelHari(x.tanggal) + ' ' + x.tanggal.slice(0, 7), angka(x.jumlah), rupiah(x.omzet), rupiah(x.laba)]),
      ['Total', angka(d.jumlah), rupiah(d.omzet), rupiah(d.labaKotor)]));

  function renderPecahan() {
    const daftar = (S.infoShift && S.infoShift.pecahan) || [100000, 50000, 20000, 10000, 5000, 2000, 1000, 500, 200, 100];
    $('#tt-pecahan').replaceChildren(...daftar.map((p) => {
      const sub = h('span', { class: 'sub' });

        kasSt.pecahan[p] = Math.max(0, Math.floor(n) || 0);
        input.value = kasSt.pecahan[p] ? String(kasSt.pecahan[p]) : '';
        sub.textContent = kasSt.pecahan[p] ? rupiah(p * kasSt.pecahan[p]) : '';
        perbaruiSelisih();
      };
      input.addEventListener('input', () => atur(Number(input.value.replace(/[^\d]/g, ''))));

      sub.textContent = kasSt.pecahan[p] ? rupiah(p * kasSt.pecahan[p]) : '';

  /** Tabel dengan baris yang bisa diklik (dan difokus + Enter lewat tombol di sel pertama). */
  function tabelKlik(kolom, baris) {
    const tbl = tabelData(kolom, baris.map((b) => b.sel));
    const tr = tbl.querySelectorAll('tbody tr');
    baris.forEach((b, i) => {
      tr[i].classList.add('bisa-klik');
      tr[i].tabIndex = 0;
      tr[i].addEventListener('click', b.klik);
      tr[i].addEventListener('keydown', (e) => { if (e.key === 'Enter') b.klik(); });
    });
    tbl.classList.add('tabel-nota');
    return tbl;

  // ======================================================================
  // Printer struk per perangkat: dialog cetak browser atau RawBT (printer thermal Bluetooth)
  // ======================================================================
  const bacaLokal = (k, bawaan) => { try { return localStorage.getItem(k) || bawaan; } catch (e) { return bawaan; } };
  const tulisLokal = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* abaikan */ } };
  const modeCetak = () => bacaLokal('pos_cetak', 'browser');

  /** Baris teks -> perintah ESC/POS (init, teks ASCII, spasi, potong kertas) dalam base64. */
  function escposBase64(baris) {
    // Printer thermal memakai code page, bukan UTF-8: huruf beraksen dilepas aksennya, sisanya jadi "?".
    const teks = baris.join('\n').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E\n]/g, '?');
    let biner = String.fromCharCode(0x1B, 0x40) + teks + '\n\n\n\n' + String.fromCharCode(0x1D, 0x56, 0x42, 0x00);
    return btoa(biner);
  }

  /** Kirim ke aplikasi RawBT (Android). Harus dipicu langsung oleh ketukan pengguna. */
  function kirimRawbt(baris) {
    const url = 'intent:base64,' + escposBase64(baris) + '#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';
    // Web App berjalan di iframe: navigasi intent dilakukan di jendela teratas lewat tautan sementara.
    const a = h('a', { href: url, target: '_top', rel: 'noopener', style: 'display:none' });
    document.body.append(a);
    a.click();
    a.remove();
  }

  /** Cetak baris teks (RawBT) bila dipilih, selain itu pakai struk HTML + dialog cetak. */
  function cetakTeksAtauHtml(teks, isiHtml) {
    if (modeCetak() === 'rawbt' && teks && teks.length) {
      kirimRawbt(teks);
      return;
    }
    $('#struk').replaceChildren(...isiHtml);
    cetakDengan('struk');
  }

  function renderPilihanPrinter() {
    const m = modeCetak();
    $$('#pilih-printer button').forEach((b) => {
