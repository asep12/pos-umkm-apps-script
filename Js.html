  // ======================================================================
  // Scan barcode dengan kamera (BarcodeDetector; cadangan: ambil foto)
  // ======================================================================
  const kamera = { stream: null, detektor: null, aktif: false };
  const dukungScan = 'BarcodeDetector' in window;
  $('#tombol-kamera').hidden = !dukungScan;

  /** Masukkan item berdasarkan kode barcode (dipakai scanner USB, kamera, maupun Enter di kolom cari). */
  function masukkanKode(kode) {
    const k = String(kode || '').trim().toLowerCase();
    const p = S.produk.find((x) => x.kode && x.kode.toLowerCase() === k);
    if (!p) {
      toast('Kode "' + kode + '" tidak ditemukan.', 'galat');
      return false;
    }
    tambahKeKeranjang(p, 1);
    toast(p.nama + ' masuk keranjang.', 'sukses');
    return true;
  }

  async function buatDetektor() {
    if (kamera.detektor) return kamera.detektor;
    const ingin = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'qr_code'];
    let format = ingin;
    try {
      const didukung = await BarcodeDetector.getSupportedFormats();
      format = ingin.filter((f) => didukung.indexOf(f) !== -1);
    } catch (e) { /* pakai daftar bawaan */ }
    kamera.detektor = new BarcodeDetector({ formats: format });
    return kamera.detektor;
  }

  function hentikanKamera() {
    kamera.aktif = false;
    if (kamera.stream) kamera.stream.getTracks().forEach((t) => t.stop());
    kamera.stream = null;
    $('#video-kamera').srcObject = null;
  }

  async function bukaKamera() {
    $('#modal-kamera').hidden = false;
    $('#bungkus-foto-barcode').hidden = true;
    $('#status-kamera').textContent = 'Mengaktifkan kamera…';
    try {
      const detektor = await buatDetektor();
      kamera.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      const video = $('#video-kamera');
      video.srcObject = kamera.stream;
      await video.play();
      kamera.aktif = true;
      $('#status-kamera').textContent = 'Arahkan barcode ke garis merah.';
      const pindai = async () => {
        if (!kamera.aktif) return;
        try {
          const hasil = await detektor.detect(video);
          if (hasil.length) {
            hentikanKamera();
            $('#modal-kamera').hidden = true;
            masukkanKode(hasil[0].rawValue);
            return;
          }
        } catch (e) { /* bingkai belum siap */ }
        setTimeout(pindai, 250);
      };
      pindai();
    } catch (e) {
      // Kamera langsung sering diblokir di dalam iframe Apps Script: tawarkan ambil foto.
      hentikanKamera();
      $('#status-kamera').textContent = 'Kamera langsung tidak tersedia di halaman ini. Ambil foto barcode (dekat & terang).';
      $('#bungkus-foto-barcode').hidden = false;
    }
  }

  $('#tombol-kamera').addEventListener('click', bukaKamera);
  $('#tutup-kamera').addEventListener('click', () => { hentikanKamera(); $('#modal-kamera').hidden = true; });
  // Modal ditutup dengan Esc juga harus mematikan kamera.
  new MutationObserver(() => { if ($('#modal-kamera').hidden) hentikanKamera(); })
    .observe($('#modal-kamera'), { attributes: true, attributeFilter: ['hidden'] });
  $('#foto-barcode').addEventListener('change', async (e) => {
    const berkas = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!berkas) return;
    $('#status-kamera').textContent = 'Membaca barcode…';
    try {
      const gambar = await createImageBitmap(berkas);
      const hasil = await (await buatDetektor()).detect(gambar);
      if (!hasil.length) {
        $('#status-kamera').textContent = 'Barcode tidak terbaca. Coba foto lebih dekat, tegak lurus, dan cukup terang.';
        return;
      }
      $('#modal-kamera').hidden = true;
      masukkanKode(hasil[0].rawValue);
    } catch (err) {
      $('#status-kamera').textContent = 'Gagal membaca foto. Coba lagi.';
    }
  });

  function renderDaftarBill() {
    isiWadah($('#daftar-bill'), daftarBill.length ? daftarBill.map((b) => h('div', { class: 'kartu-bill' + (S.billAktif && S.billAktif.id === b.id ? ' aktif' : '') },

      h('div', { class: 'bawah', text: 'diubah ' + b.diperbarui.slice(11) + ' · ' + b.kasir + (b.catatan ? ' · ' + b.catatan : '') }),
      h('div', { class: 'aksi-bill' },
        h('button', { type: 'button', class: 'tombol utama kecil', text: 'Buka & tambah/bayar', onclick: () => muatBill(b) }),

  function muatBill(b) {
    const ganti = S.keranjang.length && !(S.billAktif && S.billAktif.id === b.id);
    const cadangan = ganti ? { items: S.keranjang.slice(), bill: S.billAktif } : null;
    S.keranjang = [];
    let hilang = 0;
    b.items.forEach((x) => {
      const p = S.produk.find((y) => y.id === x.idItem);
      if (p) S.keranjang.push({ idItem: p.id, nama: p.nama, harga: p.hargaJual, satuan: p.satuan, qty: x.qty });
      else hilang++;
    });
    S.billAktif = { id: b.id, nama: b.nama, versi: b.versi, catatan: b.catatan };
    $('#catatan-trx').value = b.catatan || '';
    $('#modal-bill').hidden = true;
    perbaruiKeranjang();
    if (hilang) toast(hilang + ' item di bill sudah tidak tersedia.', 'galat');
    else if (cadangan) {
      toast('Keranjang diganti dengan bill ' + b.nama + '.', '', {
        label: 'Urungkan', fn: () => { S.keranjang = cadangan.items; S.billAktif = cadangan.bill; perbaruiKeranjang(); },
      });
    } else toast('Bill ' + b.nama + ' dibuka.', 'sukses');
    if (!layarLebar()) $('#panel-keranjang').classList.add('terbuka');
  }

  function batalkanBill(tombol, b) {
    if (!confirm('Batalkan bill ' + b.nama + '? Pesanan ini tidak jadi dibayar.')) return;
    denganTombol(tombol, 'Membatalkan…', async () => {
      try {
        await api('batalBill', b.id, b.versi);
        if (S.billAktif && S.billAktif.id === b.id) { S.billAktif = null; perbaruiKeranjang(); }
        toast('Bill ' + b.nama + ' dibatalkan.', 'sukses');
        await segarkanBill();
        renderDaftarBill();
      } catch (g) {
        tanganiGalat(g);
      }
    });
  }

  function simpanSebagaiBill() {
    if (!S.keranjang.length) { toast('Keranjang masih kosong.', 'galat'); return; }
    if (S.billAktif) { kirimBill(S.billAktif.nama, $('#catatan-trx').value, $('#simpan-bill')); return; }
    $('#form-simpan-bill').reset();
    $('#sb-pesan').textContent = '';
    const terpakai = daftarBill.map((b) => b.nama.toLowerCase());
    const meja = [];
    for (let i = 1; meja.length < 8 && i <= 30; i++) if (terpakai.indexOf(('meja ' + i)) === -1) meja.push('Meja ' + i);
    $('#sb-cepat').replaceChildren(...meja.map((m) => h('button', { type: 'button', class: 'chip', text: m, onclick: () => { $('#sb-nama').value = m; } })));
    $('#saran-meja').replaceChildren(...meja.map((m) => h('option', { value: m })));
    $('#sb-catatan').value = $('#catatan-trx').value;

    $('#sb-nama').focus();

  function kirimBill(nama, catatan, tombol) {
    const data = {
      id: S.billAktif ? S.billAktif.id : '', versi: S.billAktif ? S.billAktif.versi : '',
      nama: nama, catatan: catatan, items: S.keranjang.map((b) => ({ idItem: b.idItem, qty: b.qty })),

      } catch (g) {
        tanganiGalat(g, $('#modal-simpan-bill').hidden ? null : $('#sb-pesan'));

  const JUDUL_TEMPLAT = ['Nama', 'Tipe', 'Kategori', 'Satuan', 'Harga Beli', 'Harga Jual', 'Stok', 'Stok Min', 'Kode', 'Lacak Stok'];

  function dataImpor(pratinjau) {
    return { teks: $('#im-teks').value, mode: imp.mode, buatBarcode: $('#im-barcode').checked, pratinjau: pratinjau };
  }

  $$('#im-mode button').forEach((b) => b.addEventListener('click', () => pilihModeImpor(b.dataset.mode)));
  ['#im-teks', '#im-barcode'].forEach((sel) => $(sel).addEventListener('input', batalPratinjauImpor));
  $('#tombol-impor').addEventListener('click', bukaImpor);

  $('#im-salin-templat').addEventListener('click', async () => {
    const teks = JUDUL_TEMPLAT.join('\t');
    try {
      await navigator.clipboard.writeText(teks);
      toast('Judul kolom disalin. Tempel di baris 1 Excel/Sheets.', 'sukses');
    } catch (e) {
      // Clipboard bisa diblokir di iframe: taruh di kotak teks agar bisa disalin manual.
      if (!$('#im-teks').value.trim()) $('#im-teks').value = teks + '\n';
      toast('Judul kolom dimasukkan ke kotak data.', 'sukses');

  $('#im-file').addEventListener('change', (e) => {
    const berkas = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!berkas) return;
    if (berkas.size > 500 * 1024) { $('#im-pesan').textContent = 'File terlalu besar (maks 500 KB).'; return; }
    const baca = (enkode) => new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result));
      r.onerror = rej;
      r.readAsText(berkas, enkode);
    });
    baca('utf-8').then((teks) => (teks.indexOf('�') !== -1 ? baca('windows-1252') : teks)).then((teks) => {
      // CSV lama dari Excel Windows sering ber-enkode windows-1252: baca ulang bila ada karakter rusak.
      $('#im-teks').value = teks;
      batalPratinjauImpor();
      toast('File "' + berkas.name + '" dimuat. Tekan Pratinjau.', 'sukses');
    }).catch(() => { $('#im-pesan').textContent = 'Gagal membaca file.'; });

  $('#im-pratinjau').addEventListener('click', (e) => {
    const pesan = $('#im-pesan');
    pesan.textContent = '';
    if (!$('#im-teks').value.trim()) { pesan.textContent = 'Tempel data tabel atau pilih file CSV dulu.'; return; }
    denganTombol(e.currentTarget, 'Memeriksa…', async () => {
      try {
        const r = await api('imporItem', dataImpor(true));
        renderHasilImpor(r);

  /** Pola 95 modul EAN-13 -> SVG. Batang penjaga (awal, tengah, akhir) lebih panjang seperti barcode cetak asli. */
  function svgBarcode(bits, kode) {
    const tepi = 9;
    const lebar = bits.length + tepi * 2;
    const penjaga = (i) => i < 3 || (i >= 45 && i < 50) || i >= 92;
    const svg = sv('svg', { viewBox: '0 0 ' + lebar + ' 62', class: 'barcode', role: 'img', 'aria-label': 'Barcode ' + kode, preserveAspectRatio: 'none' });
    for (let i = 0; i < bits.length; i++) {
      if (bits[i] !== '1') continue;
      let j = i;
      while (j + 1 < bits.length && bits[j + 1] === '1' && penjaga(j + 1) === penjaga(i)) j++;
      svg.append(sv('rect', { x: tepi + i, y: 0, width: j - i + 1, height: penjaga(i) ? 54 : 48, fill: '#000' }));
      i = j;
    }
    svg.append(sv('text', { x: lebar / 2, y: 61, 'text-anchor': 'middle', 'font-size': 8, 'font-family': 'monospace', fill: '#000', text: kode }));
    return svg;
  }

      try {
        const hasil = await api('setAktifItem', item.id, !item.aktif);
        simpanKeDaftarLokal(hasil);
        toast(hasil.aktif ? 'Item diaktifkan.' : 'Item dinonaktifkan.', 'sukses');
        pindahLayar('item');
        segarkanProduk(false);
      } catch (g) {
        tanganiGalat(g, $('#fi-pesan'));
      }
    });
  });

  // ---------- Resep ----------
  async function muatResep() {
    S.resepEdit = [];
    renderResep();
    const item = S.itemDiedit;
    if (!item || item.tipe !== 'Menu') return;
    try {
      const d = await api('getResep', item.id);
      if (S.itemDiedit !== item) return; // pengguna sudah pindah item
      S.resepEdit = d.baris.map((b) => ({ idBahan: b.idBahan, qty: b.qty }));
      renderResep();
      perbaruiTampilanTipe();
    } catch (g) {
      tanganiGalat(g);
    }
  }

  function calonBahan() {
    return (S.semuaItem || []).filter((i) => i.tipe !== 'Menu' && (i.aktif || S.resepEdit.some((r) => r.idBahan === i.id)));
  }

  function renderResep() {
    const bahan = calonBahan();
    const peta = {};
    bahan.forEach((b) => { peta[b.id] = b; });
    const tbody = $('#baris-resep');
    if (!S.resepEdit.length) {
      tbody.replaceChildren(h('tr', null, h('td', { class: 'bantu', text: 'Belum ada bahan. Menu tetap bisa dijual tanpa resep.' })));
    } else {
      tbody.replaceChildren(...S.resepEdit.map((r, idx) => {
        const b = peta[r.idBahan];
        const pilih = h('select', { 'aria-label': 'Bahan', onchange: (e) => { r.idBahan = e.target.value; renderResep(); } },
          h('option', { value: '', text: '— pilih bahan —' }),
          ...bahan.map((x) => h('option', { value: x.id, text: x.nama + ' (' + x.satuan + ')' })));
        pilih.value = r.idBahan || '';
        return h('tr', null,
          h('td', null, pilih),
          h('td', null, h('input', {
            value: r.qty ? angka(r.qty) : '', inputmode: 'decimal', 'aria-label': 'Qty',
            onchange: (e) => { r.qty = parseQty(e.target.value); renderResep(); },
          })),
          h('td', { class: 'satuan', text: b ? b.satuan : '' }),
          h('td', { class: 'biaya', text: b && r.qty > 0 ? rupiah(b.hargaBeli * r.qty) : '' }),
          h('td', null, h('button', { type: 'button', class: 'tombol teks kecil', 'aria-label': 'Hapus bahan', onclick: () => { S.resepEdit.splice(idx, 1); renderResep(); } }, ikon('tutup'))));
      }));
    }
    const hpp = S.resepEdit.reduce((s, r) => s + (peta[r.idBahan] && r.qty > 0 ? peta[r.idBahan].hargaBeli * r.qty : 0), 0);
    $('#total-hpp').textContent = rupiah(hpp);
  }

  $('#tambah-bahan').addEventListener('click', async () => {
    if (!S.semuaItem) await bukaDaftarItem();
    S.resepEdit.push({ idBahan: '', qty: 0 });
    renderResep();
  });

  $('#simpan-resep').addEventListener('click', (e) => {
    const baris = S.resepEdit.filter((r) => r.idBahan);
    if (baris.some((r) => !(r.qty > 0))) { toast('Isi qty setiap bahan (lebih dari 0).', 'galat'); return; }
    const item = S.itemDiedit;
    denganTombol(e.currentTarget, 'Menyimpan…', async () => {
      try {
        const d = await api('simpanResep', item.id, baris);
        S.resepEdit = d.baris.map((b) => ({ idBahan: b.idBahan, qty: b.qty }));
        item.hargaBeli = d.hpp;
        item.margin = item.hargaJual > 0 ? (item.hargaJual - d.hpp) / item.hargaJual : null;
        $('#fi-harga-beli').value = d.hpp ? angka(d.hpp) : '';
        simpanKeDaftarLokal(item);
        renderResep();
        perbaruiTampilanTipe();
        toast('Resep tersimpan. HPP ' + rupiah(d.hpp) + '.', 'sukses');
      } catch (g) {
        tanganiGalat(g);
      }
    });
  });

  // ======================================================================
  // Mulai
  // ======================================================================
  async function mulai() {
    S.token = penyimpan.ambil('pos_token', null);
    if (!S.token) { tampilLogin(''); return; }
    try {
      await masukAplikasi();
    } catch (g) {
      if (!g.ditangani) tampilLogin(g.pesan);
    }
  }

  mulai();
})();
</script>
